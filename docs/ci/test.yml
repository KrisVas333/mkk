name: test

# End-to-end tests on every push and PR. This workflow does NOT deploy —
# GitHub Pages stays branch-based exactly as it was.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright e2e (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Serve the static app
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8765/index.html >/dev/null && break
            sleep 1
          done
          curl -sfI http://localhost:8765/index.html | head -1

      - name: Run e2e tests
        env:
          CI: 'true'
          # the app is already being served above; stop Playwright starting its own
          PLAYWRIGHT_SKIP_WEBSERVER: '1'
        run: npx playwright test

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
