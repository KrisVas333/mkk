jonas Vasiliauskas","role":"Autorius · praktikas, ne mokslininkas","body":["Ne mokslininkas, o praktikas. Daugiau nei dešimtmetį mokiau vaikus statyti robotus ir mačiau, kas per pamoką iš tikrųjų veikia, o kas tik gražiai atrodo.","Pats puslapį normaliai perskaityti pradėjau vienuolikos. Todėl MKK kalba trumpai, garsu ir ikonomis — taip, kaip man pačiam būtų padėję.","Kiekviena technika čia turi šaltinį. Jei šaltinio nėra — parašyta, kad jo nėra, ir ženklelis nukrenta į C."],"coi":"Interesų konfliktas: esu ExoClass bendraįkūrėjas, BrAIn Club kūrėjas ir robotikos būrelio savininkas. „MKK+ nemokamai“ galioja BET KURIO būrelio vaikams — tai dovana, ne veiklų reitingas. Būrelių skiltyje veiklos rikiuojamos abėcėle, robotika niekada nėra pirma, ir nė viena veikla čia nereitinguojama.","link":"krisvas.lt"},"en":{"name":"Kristijonas Vasiliauskas","role":"Author · a practitioner, not a scientist","body":["Not a scientist — a practitioner. For more than a decade I taught children to build robots and watched what actually works in a lesson and what only looks good.","I could not read a page properly until I was eleven. That is why MKK speaks in short lines, audio and icons — the way that would have helped me.","Every technique here carries a source. If there is no source, it says so, and the badge drops to C."],"coi":"Conflict of interest: I am a co-founder of ExoClass, the maker of BrAIn Club and the owner of a robotics club. \"MKK+ for free\" applies to children from ANY after-school club — it is a gift, not a ranking of activities. In the clubs section the activities are listed alphabetically, robotics is never first, and no activity is ranked here.","link":"krisvas.lt"}},"maker":{"lt":{"title":"Apie kūrėją — kaip MKK daroma","body":["Tekstas parašytas su Claude Code iš mano paties antrųjų smegenų (wiki) — ten guli tyrimai, pamokų užrašai ir tai, ką mačiau su vaikais.","Iliustracijos sugeneruotos su Higgsfield (Recraft).","Balsas — Kraist: mano paties balso AI klonas per ElevenLabs. Tai pasakyta kiekvieno podcast'o viduje, ne tik čia.","Turinys vertinamas pagal mokymosi mokslo kurso kriterijus: A / B / C ženklelis kiekvienai technikai."],"note":"Eksperimentinis, gali klysti. Grįžtamasis ryšys laukiamas: krisvas.lt"},"en":{"title":"About the creator — how MKK is made","body":["The text is written with Claude Code out of my own second brain (a wiki) — that is where the research, the lesson notes and what I saw with children live.","Illustrations are generated with Higgsfield (Recraft).","The voice is Kraist: an AI clone of my own voice via ElevenLabs. That is said inside every podcast, not only here.","Content is graded with the criteria from the learning-science course: an A / B / C badge on every technique."],"note":"Experimental, can be wrong. Feedback welcome: krisvas.lt"}},"how":{"lt":{"title":"Kaip tai buvo padaryta","steps":["2026-09-15, 00:50 — idėja: „programėlė, kuri moko vaiką mokytis, po 3 minutes per dieną“.","Tyrimas — mokymosi mokslo šaltiniai, esamos panašios programėlės, ko jose trūksta.","Statyba — paprastas HTML/CSS/JS, be framework'o, kad veiktų ir be interneto.","Taryba — bias (ar nešališka), personas (kaip reaguos tėvai), critic (ar tai, ko prašyta).","Iliustracijos — 22 piešiniai, vienas tonas kiekvienai temai.","Vieša beta — su šia eilute, kad matytum, kiek tai dar jauna."]},"en":{"title":"How this was made","steps":["15 Sep 2026, 00:50 — the idea: \"an app that teaches a child to learn, three minutes a day\".","Research — learning-science sources, the apps that already exist, what is missing in them.","Build — plain HTML/CSS/JS, no framework, so it works offline too.","Counsel — bias (is it unbiased), personas (how will parents react), critic (is this what was asked for).","Illustrations — 22 drawings, one tone per topic.","Public beta — with this very line, so you can see how young it still is."]}},"scientists":{"lt":{"title":"Kviestiniai mokslininkai — netrukus","note":"Kol kas MKK kalba vienu balsu — mano. Tai per mažai. Kviečiame mokslininkus, kurie pasakys tą patį savo žodžiais ir pataisys ten, kur klystu.","roles":["Neuromokslininkas — kas iš tikrųjų vyksta galvoje, kai vaikas mokosi","Kognityvinis mokslininkas — kodėl prisiminti sunkiau nei perskaityti","Mokymosi mokslininkas — ko mokykla apie mokymąsi nepasako"],"cta":"Esi vienas iš jų? Parašyk: krisvas.lt"},"en":{"title":"Guest scientists — coming soon","note":"For now MKK speaks with one voice — mine. That is not enough. We are inviting scientists to say the same things in their own words and correct me where I am wrong.","roles":["Neuroscientist — what actually happens in the head while a child learns","Cognitive scientist — why recalling is harder than re-reading","Learning scientist — what school does not tell you about learning"],"cta":"Are you one of them? Write: krisvas.lt"}},"privacy":{"lt":{"title":"Privatumas","body":["Nulis duomenų išeina iš šito telefono.","Nėra paskyrų. Nėra prisijungimo. Nėra slaptažodžio.","Nėra analitikos, nėra slapukų, nėra sekimo pikselių.","Serija, dienos, vardai ir žaidimų rezultatai laikomi tik naršyklės atmintyje (localStorage).","Garsas ir paveikslėliai krenta iš tos pačios svetainės — jokių trečių šalių.","Nori viską ištrinti? „Aš“ → Duomenys → Ištrinti viską. Dings iš karto ir be kopijų."]},"en":{"title":"Privacy","body":["Zero data leaves this phone.","No accounts. No sign-in. No password.","No analytics, no cookies, no tracking pixels.","Streaks, days, names and game results live only in the browser's own storage (localStorage).","Audio and images come from this same site — no third parties.","Want it all gone? Me → Data → Delete everything. It goes instantly, with no copies."]}},"beta":{"lt":{"title":"Nori tapti beta testuotoju?","body":"Ieškau tėvų ir vaikų, kurie naudos MKK savaitę ir pasakys, kur nuobodu, kur neaišku ir kur meluoju. Be formų — tiesiog parašyk.","cta":"Rašyk: krisvas.lt","url":"https://krisvas.lt"},"en":{"title":"Want to be a beta tester?","body":"I am looking for parents and children who will use MKK for a week and tell me where it is boring, where it is unclear, and where I am wrong. No forms — just write.","cta":"Write: krisvas.lt","url":"https://krisvas.lt"}}},"blog":[{"id":"kaip-naudotis-mkk","type":"tutorial","title":{"lt":"Kaip naudotis MKK","en":"How to use MKK"},"summary":{"lt":"6 žingsniai iki pirmos 3 minučių treniruotės.","en":"6 steps to your first 3-minute session."},"body":{"lt":"**1. Pasirink amžių.** MKK dalija technikas ir žaidimus pagal amžiaus grupes 4–14. Neatspėk — pasirink vaiko tikrą amžių, ne norimą lygį.\n\n**2. Atsidaryk vieną kategoriją.** Smegenys · Top 3 · Atmintis · Dėmesys · Fokusas · Koncentracija. Nesistenk padaryti visko iš karto. Viena kategorija, viena diena.\n\n**3. Perskaityk techniką — 30 sekundžių.** Kiekviena turi žymeklį A/B/C. Žymeklis sako, kiek galima ja remtis, ne kiek ji graži.\n\n**4. Padaryk praktiką su vaiku — 3 minutes.** Tai ne teorija vaikui skaityti. Tai vienas veiksmas, kurį darai kartu su juo, laikmačiu rankoje.\n\n**5. Pažaisk vieną žaidimą arba paklausyk podcast'o.** Žaidimai treniruoja tą pačią techniką žaidimo forma. Podcast'ai — trumpi, vaiko balsu.\n\n**6. Pasikeisk kalbą arba temą bet kada.** LT/EN mygtukas viršuje. Dovanos kodas (nemokamas visiems būreliams) — nustatymuose.\n\n⚗️ Eksperimentinis prototipas, sukurtas su AI. Gali klysti — svarbius dalykus pasitikrinkite. Nemokamas. Radote klaidą? Parašykite: krisvas.lt","en":"**1. Pick the age.** MKK sorts techniques and games by age band, 4–14. Don't guess up — pick the child's real age, not the level you wish they were at.\n\n**2. Open one category.** Brain · Top 3 · Memory · Attention · Focus · Concentration. Don't try all of them today. One category, one day.\n\n**3. Read the technique — 30 seconds.** Every one carries an A/B/C tag. The tag says how much you can lean on it, not how good it sounds.\n\n**4. Do the practice with the child — 3 minutes.** It's not theory for the kid to read. It's one action you do together, timer in hand.\n\n**5. Play one game or listen to one podcast.** Games train the same technique in game form. Podcasts are short, in a kid's voice.\n\n**6. Switch language or theme any time.** LT/EN toggle at the top. Gift code (free for every after-school club) lives in settings.\n\n⚗️ Experimental prototype, built with AI. It can be wrong — check anything that matters. Free. Found a mistake? Write to krisvas.lt"},"source":{"name":"MKK","url":"https://krisvas.lt","lang":"lt"},"grade":"C","age":"4-14","tone":"#9BB59C","status":"published"},{"id":"prisiminimas-vs-perskaitymas","type":"article","title":{"lt":"Prisiminimas be žiūrėjimo veikia geriau nei skaitymas dar kartą","en":"Recalling without looking beats reading it again"},"summary":{"lt":"Klasėje: 67 % teisingai su testu, 48,6 % — perskaičius dar kartą.","en":"In real classrooms: 67% correct with a test, 48.6% with rereading."},"body":{"lt":"Vaikas užsidaro knygą ir bando pasakyti, ką prisimena. Nepatogu, lėčiau, dažnai nutyla. Būtent tas nepatogumas ir moko.\n\n2013 m. didelė apžvalga peržiūrėjo dešimtis mokymosi technikų ir surikiavo jas pagal įrodymus. Prisiminimas be žiūrėjimo (retrieval practice) atsidūrė pačioje viršūnėje. Perskaitymas dar kartą, pasibraukimas — apačioje.\n\n2025 m. tikroje penktoje klasėje (ne laboratorijoje) tai patikrino iš naujo: mokiniai, kurie po pamokos atsakinėjo į klausimus be knygos, po savaitės atsiminė 67 % medžiagos. Tie, kurie tiesiog perskaitė dar kartą — 48,6 %.\n\n**Ką daryti namie:** uždaryk knygą. Paklausk „papasakok, ką prisimeni“. Palauk 10 sekundžių tylos prieš padedant. Tik po to patikrinkit kartu, ko trūko.\n\n⚠️ Tas pats 2025 m. tyrimas parodė, kad kartojimo intervalo keitimas (diena vs keturios) klasėje nieko nepakeitė — nors laboratorijoje veikia. Prisiminimas — stipriausia dalis. Intervalas — silpnesnė, nei parduodama.","en":"A child closes the book and tries to say what they remember. It's awkward, slower, they often go quiet. That discomfort is exactly what teaches.\n\nA 2013 review scored dozens of study techniques by evidence. Retrieval practice — recalling without looking — came out on top. Rereading and highlighting came last.\n\nA 2025 study tested it again in a real fifth-grade classroom, not a lab: students who answered questions from memory after a lesson remembered 67% a week later. Students who just reread the material remembered 48.6%.\n\n**What to do at home:** close the book. Ask \"tell me what you remember.\" Wait 10 seconds of silence before helping. Only then check together what was missing.\n\n⚠️ The same 2025 study found that changing the repeat interval (one day vs. four) made no difference in the real classroom — even though it works in the lab. Retrieval is the strong part. Spacing is weaker than it's sold as."},"source":{"name":"Dunlosky ir kt. 2013 · Franzoi ir kt. 2025","url":"https://www.retrievalpractice.org/why-it-works","lang":"en"},"grade":"A","age":"4-14","tone":"#D8B4B0","status":"published"},{"id":"miegas-ir-atmintis","type":"article","title":{"lt":"Miegas sutvirtina tai, ko vaikas mokėsi vakar","en":"Sleep locks in what a child learned yesterday"},"summary":{"lt":"Vienas tyrimas: vaikai, kurie pamiegojo prieš testą, atsakė 20 % geriau.","en":"One study: kids who slept before the test scored 20% better."},"body":{"lt":"Neišsimiegojęs vaikas ne tik pavargęs — jo smegenys tiesiog blogiau saugo tai, ką ką tik išmoko.\n\nViename tyrime su 10–14 metų vaikais viena grupė mokėsi atminties užduočių vakare ir buvo tikrinama tik kitą rytą, po miego. Vaikai, kuriems buvo leista pamiegoti tarp mokymosi ir testo, atsakė apytiksliai 20 % geriau nei tie, kurie buvo tikrinami tą pačią dieną be miego tarp.\n\n7–12 metų vaikams miegas dirba efektyviau nei suaugusiam: per naktį jie išlaiko tai, ką suaugęs žmogus per tą pačią naktį dažnai pamiršta. Amerikos miego medicinos akademija rekomenduoja 6–12 metų vaikams 9–12 val. miego per parą.\n\n**Ką daryti namie:** naują dalyką pakartok vakare, prieš miegą — 2 minutės, be ekrano. Ryte paklausk, kas liko atmintyje. Tai ne papildoma pamoka. Tai naudoja tai, ką smegenys daro nakties metu bet kuriuo atveju.\n\n⚠️ Tikslus procentas skiriasi tyrimuose ir amžiaus grupėse — imk kaip kryptį, ne garantiją konkrečiam vaikui.","en":"A tired child isn't just tired — their brain simply stores what it just learned worse.\n\nIn one study with 10–14 year olds, one group learned memory tasks in the evening and was only tested the next morning, after sleep. Kids who slept between learning and the test scored roughly 20% better than kids tested the same day with no sleep in between.\n\nFor 7–12 year olds, sleep works harder than it does for adults: overnight, they keep what an adult often loses over the same night. The American Academy of Sleep Medicine recommends 9–12 hours a night for 6–12 year olds.\n\n**What to do at home:** review something new in the evening, before bed — 2 minutes, no screen. In the morning, ask what stuck. This isn't an extra lesson. It's using what the brain does overnight anyway.\n\n⚠️ The exact percentage varies by study and age group — take it as a direction, not a guarantee for any one child."},"source":{"name":"LRT — Kodėl vaikams prastėja atmintis","url":"https://www.lrt.lt/naujienos/mokslas-ir-it/11/1718741/kodel-vaikams-prasteja-atmintis-ir-ka-daryti-kad-ji-pasitaisytu","lang":"lt"},"grade":"B","age":"6-14","tone":"#8E93B5","status":"published"},{"id":"telefonas-kitame-kambaryje","type":"article","title":{"lt":"Telefonas kitame kambaryje — ne kišenėje","en":"Phone in another room, not in the pocket"},"summary":{"lt":"Vien telefono buvimas šalia (net išjungto) mažina galimybę susikaupti.","en":"Just having the phone nearby (even off) drains attention."},"body":{"lt":"Nereikia, kad telefonas skambėtų ar vibruotų. Užtenka, kad jis tiesiog gulėtų ant stalo.\n\nTeksaso universiteto tyrime su beveik 800 suaugusiųjų dalyviai buvo padalinti į tris grupes: telefonas ant stalo, telefonas kišenėje ar krepšyje, telefonas kitame kambaryje. Visiems buvo duotos užduotys, reikalaujančios dėmesio ir darbinės atminties. Geriausiai užduotis atliko tie, kurių telefonas buvo kitame kambaryje. Prasčiausiai — tie, kurių telefonas gulėjo ant stalo, net išjungtas ir apverstas.\n\nMokslininkai tai vadina „dėmesio nutekėjimu“ — dalis smegenų nuolat dirba stengdamasi NEGALVOTI apie telefoną, ir ta pastanga suvalgo dalį jėgų, kurių reikėtų užduočiai.\n\n**Ką daryti namie:** prieš pamokas ar namų darbus telefoną (savo ir vaiko) padėk kitame kambaryje, ne ant stalo apverstą. Pilkas ekranas (spalvų išjungimas telefone) papildomai mažina trauką pačiam paimti telefoną be reikalo.\n\n⚠️ Tyrimas darytas su suaugusiais, ne vaikais. ⚠️ 2023 m. metaanalizė kelia klausimą dėl efekto dydžio — mechanizmas tikras, poveikis gali būti mažesnis nei pirminis tyrimas rodė.","en":"The phone doesn't need to ring or buzz. It's enough that it's just lying on the table.\n\nIn a University of Texas study with nearly 800 adults, participants were split into three groups: phone on the desk, phone in pocket or bag, phone in another room. Everyone did tasks requiring attention and working memory. The group with the phone in another room performed best. The group with the phone on the desk — even off and face-down — performed worst.\n\nResearchers call this \"attention leakage\": part of the brain keeps working to NOT think about the phone, and that effort eats into capacity the task actually needs.\n\n**What to do at home:** before homework or a lesson, put the phone (yours and the child's) in another room — not face-down on the table. Grayscale mode (turning off colour) further cuts the pull to pick it up without a reason.\n\n⚠️ The study was done with adults, not children. ⚠️ A 2023 meta-analysis questions the size of the effect — the mechanism is real, the impact may be smaller than the original study suggested."},"source":{"name":"Ward ir kt. 2017 (LT: technaujienos.lt)","url":"https://www.technaujienos.lt/sokiruojantis-tyrimas-stai-kodel-ismanuji-telefona-reikia-palikti-kuo-toliau-priezastis-visai-ne-radiacijoje/","lang":"lt"},"grade":"B","age":"8-14","tone":"#9FB3C8","status":"published"},{"id":"mokymosi-stiliu-mitas","type":"article","title":{"lt":"„Vizualas“, „audialas“, „kinestetikas“ — mitas, ne diagnozė","en":"\"Visual\", \"auditory\", \"kinesthetic\" — a myth, not a diagnosis"},"summary":{"lt":"Pritaikius pamoką prie „stiliaus“ rezultatai nepagerėja — tyrimai to nepatvirtina.","en":"Matching a lesson to a \"style\" doesn't improve results — the research doesn't support it."},"body":{"lt":"Vienas populiariausių mitų mokykloje: kiekvienas vaikas turi savo „mokymosi stilių“ — vizualą, audialą ar kinestetiką — ir mokosi geriausiai, kai medžiaga pritaikoma tam stiliui.\n\nLietuvos neuromokslininkė dr. Urtė Neniškytė (VU Gyvybės mokslų centras) tai vadina mitu: mokymo medžiagos diferencijavimas pagal tipus nepadeda pasiekti geresnių mokymosi rezultatų. Vaikas gali JAUSTIS patogiau vienu būdu — bet tas jausmas kyla iš patogumo, ne iš to, kad taip jis geriau įsimena.\n\nTai, kas veikia visiems vienodai: žodis IR paveikslėlis kartu (dvigubas kodavimas), kelių pojūčių derinys, ne vieno „tinkamo“ kanalo paieška.\n\n**Ką daryti namie:** nustok bandyti atspėti vaiko „tipą“. Vietoj to derink — paprašyk papasakoti IR nupiešti tą patį dalyką. Tas derinys stiprina atmintį pas visus vaikus, ne tik vieną tipą.\n\nNeigiami radiniai čia sakomi taip pat garsiai, kaip teigiami — nes tikslas ne patvirtinti gražią teoriją, o rasti tai, kas iš tikrųjų veikia.","en":"One of the most popular myths at school: every child has their own \"learning style\" — visual, auditory or kinesthetic — and learns best when material matches that style.\n\nLithuanian neuroscientist Dr. Urtė Neniškytė (Vilnius University Life Sciences Center) calls it a myth: differentiating teaching material by type doesn't produce better learning outcomes. A child may FEEL more comfortable one way — but that feeling comes from comfort, not from actually remembering more.\n\nWhat works the same for everyone: word AND picture together (dual coding), combining senses, rather than hunting for the one \"right\" channel.\n\n**What to do at home:** stop trying to guess the child's \"type\". Instead, combine — ask them to tell it AND draw it. That combination strengthens memory for every child, not one type.\n\nNegative findings get said just as loudly as positive ones here — because the goal isn't to confirm a pretty theory, it's to find what actually works."},"source":{"name":"Dr. Urtė Neniškytė (LRT)","url":"https://www.lrt.lt/naujienos/mokslas-ir-it/11/1115930/neuromokslininke-neniskyte-mitas-kad-kiekvienam-geriausiai-tinka-tam-tikras-vienas-mokymosi-stilius","lang":"lt"},"grade":"A","age":"4-14","tone":"#B8B8B8","status":"published"},{"id":"skaitymas-malonumui","type":"article","title":{"lt":"Skaitymas malonumui — ne pareiga, o pratybos smegenims","en":"Reading for pleasure — not a duty, a workout for the brain"},"summary":{"lt":"Tik apie dešimtadalis vaikų sako, kad tikrai mėgsta skaityti.","en":"Only about a tenth of children say they really love reading."},"body":{"lt":"Lietuvos nacionalinė Martyno Mažvydo biblioteka apklausė daugiau nei tūkstantį mokinių: tik šiek tiek daugiau nei dešimtadalis sakė, kad tikrai mėgsta skaityti; beveik pusė (44 %) — kad skaityti nelabai patinka arba nepatinka visai.\n\nBibliotekos leidinys „Skaitymas kaip tikslas“ skiria pareigą skaityti (mokyklai) nuo skaitymo malonumui — savanoriško, paties pasirinkto skaitymo. Būtent antrasis tipas labiausiai siejamas su noru skaityti toliau, ne pirmasis.\n\nKitas tyrimas rodo tą pačią kryptį iš kitos pusės: tėvai pradeda skaityti vaikams vis anksčiau, bet skiria tam mažiau laiko nei anksčiau — ypač vaikams iki trejų metų.\n\n**Ką daryti namie:** leisk vaikui rinktis knygą PATS, net jei ji atrodo per lengva ar „ne ta“. Pareiga ir malonumas — dvi skirtingos veiklos smegenims, ir tik antroji augina norą skaityti savaime.\n\n⚠️ Tai koreliacinė sritis — sunku atskirti, ar malonumas skaitant kuria geresnius skaitytojus, ar geri skaitytojai tiesiog labiau mėgsta skaityti.","en":"The Lithuanian National Library surveyed over a thousand students: only just over a tenth said they really love reading; almost half (44%) said they don't much like it or don't like it at all.\n\nThe library's publication \"Reading as a Goal\" separates the duty to read (for school) from reading for pleasure — voluntary, self-chosen reading. It's the second type that's most linked to wanting to keep reading, not the first.\n\nAnother study points the same direction from a different angle: parents start reading to children earlier than before, but spend less time doing it — especially with children under three.\n\n**What to do at home:** let the child pick the book THEMSELVES, even if it looks too easy or \"wrong\". Duty and pleasure are two different activities for the brain, and only the second grows the wish to read on their own.\n\n⚠️ This is correlational territory — it's hard to separate whether enjoying reading creates better readers, or good readers simply enjoy reading more."},"source":{"name":"Lietuvos nacionalinė Martyno Mažvydo biblioteka","url":"https://www.lnb.lt/tevams-ir-specialistams/leidiniai/7305-leidinys-skaitymas-kaip-tikslas-apie-skaitymo-skatinimo-metodus-ir-tyrimus","lang":"lt"},"grade":"B","age":"4-12","tone":"#E8D7B5","status":"published"},{"id":"judejimas-ir-mokymasis","type":"article","title":{"lt":"Judesys prieš mokymąsi — ne po jo","en":"Movement before learning — not after"},"summary":{"lt":"9 savaičių tyrimas: judantys vaikai geriau susikaupė ir geriau atliko užduotis.","en":"A 9-week study: kids who moved focused better and did better on tasks."},"body":{"lt":"„Pirma nusėdink, tada mokykis“ — įprasta, bet apverčia tvarką atvirkščiai.\n\nFITKids tyrime su 221 vaiku (7–9 m.) viena grupė 9 savaites po pamokų 60 minučių aktyviai judėjo, kita — ne. Judėjusi grupė vėliau geriau susikaupė ir geriau sprendė užduotis, reikalaujančias dėmesio perjungimo tarp taisyklių.\n\nLietuviškas mokslo populiarinimas tą pačią mintį pakartoja kita kryptimi: kuo mažiau vaikas juda, tuo prasčiau vystosi neuronų jungtys, atsakingos už dėmesio koncentraciją ir atmintį.\n\n**Ką daryti namie:** prieš namų darbus ar pamoką, ne po jos — 5–10 minučių aktyvaus judesio (šokinėjimas, bėgiojimas, šokis). Tai ne apšilimas prieš „tikrą“ darbą. Tai dalis darbo.\n\n⚠️ Efektas geriausiai patikrintas su 7–9 metų vaikais vidutinio intensyvumo judesiu — ne su bet kokiu fiziniu aktyvumu ir bet kokiu amžiumi.","en":"\"Sit still first, then learn\" is the default order — and it's backwards.\n\nIn the FITKids study with 221 children (7–9 y.o.), one group did 60 minutes of active movement after school for 9 weeks, the other didn't. The group that moved later focused better and did better on tasks that required switching attention between rules.\n\nLithuanian science coverage makes the same point from the other direction: the less a child moves, the worse the neural connections responsible for attention and memory develop.\n\n**What to do at home:** before homework or a lesson, not after — 5–10 minutes of active movement (jumping, running, dancing). It isn't a warm-up before the \"real\" work. It's part of the work.\n\n⚠️ The effect is best tested with 7–9 year olds and moderate-intensity movement — not with any activity at any age."},"source":{"name":"Hillman ir kt. 2014, FITKids RCT (LT: LRT)","url":"https://www.lrt.lt/naujienos/gyvenimas/13/1265938/ne-tik-kuno-bet-ir-smegenu-treniruote-judejimas-gerina-atminti-gydo-nerima-ir-mazina-stresa","lang":"lt"},"grade":"A","age":"6-12","tone":"#A9CFC1","status":"published"},{"id":"podcast-o-cia-pazymiui-sitas","type":"podcast","title":{"lt":"„O čia pažymiui šitas?“ — švietimas be kaukės","en":"\"O čia pažymiui šitas?\" — Lithuanian education, unfiltered"},"summary":{"lt":"Lietuviška tinklalaidė apie mokymąsi, vaikus ir mokyklą — jokio nuolatinio vedėjo.","en":"A Lithuanian podcast about learning, kids and school — no fixed host."},"body":{"lt":"„Renkuosi mokyti!“ bendruomenės tinklalaidė. Kiekvieną epizodą veda kitas bendruomenės narys, todėl per keliolika epizodų išgirsti daug skirtingų balsų — nuo asmeninės patirties mokykloje iki pokalbių su psichologais, tyrėjais ir švietimo ekspertais.\n\nKodėl rekomenduoju: tai vienas nedaugelio lietuviškų šaltinių, kuris kalba apie mokymąsi ir mokyklą remdamasis tyrimais, o ne vien nuomone. Pavyzdžiui, vienas epizodas remiasi naujausiais PISA tyrimo duomenimis apie socialinę nelygybę mokykloje.\n\n**Kam:** tėvams ir mokytojams, kurie nori suprasti Lietuvos švietimo sistemą iš vidaus, ne iš antraščių.","en":"A podcast by the \"Renkuosi mokyti!\" (\"I Choose to Teach\") community. Every episode is led by a different community member, so across a dozen-plus episodes you hear many different voices — from personal school stories to conversations with psychologists, researchers and education experts.\n\nWhy I recommend it: it's one of the few Lithuanian sources that talks about learning and school grounded in research, not just opinion. One episode, for example, works through the latest PISA data on inequality in school.\n\n**For:** parents and teachers who want to understand Lithuania's education system from the inside, not from headlines."},"source":{"name":"Renkuosi mokyti!","url":"https://podcasts.apple.com/lt/podcast/o-%C4%8Dia-pa%C5%BEymiui-%C5%A1itas/id1551138667","lang":"lt"},"grade":"C","age":"4-14","tone":"#9BB59C","status":"published"},{"id":"podcast-learning-scientists","type":"podcast","title":{"lt":"The Learning Scientists Podcast — tos pačios 6 strategijos, kuriomis remiasi MKK","en":"The Learning Scientists Podcast — the same 6 strategies MKK is built on"},"summary":{"lt":"Anglų kalba, kognityviniai mokslininkai, tiesiai apie tai, kas veikia mokantis.","en":"English-language, run by cognitive scientists, straight about what actually works."},"body":{"lt":"Podcast'ą veda „The Learning Scientists“ — grupė kognityvinių mokslininkių (Megan Sumeracki ir kolegos), kurios prieš dešimtmetį pradėjo nuo Twitter paskyros ir išaugo į vieną žinomiausių mokslu paremtų mokymosi šaltinių pasaulyje.\n\nTurinys tiesiogiai sutampa su MKK spina: prisiminimas be žiūrėjimo, kartojimas su tarpais, maišymas, dvigubas kodavimas, konkretizavimas, elaboratyvus klausinėjimas. Tos pačios šešios strategijos, tik plačiau paaiškintos ir su pavyzdžiais iš tikrų klasių.\n\n**Kam:** tėvams ir mokytojams, laisvai suprantantiems anglų kalbą, norintiems gilesnio, ne trumpo, paaiškinimo. LT santrauka: šešios strategijos veikia visose amžiaus grupėse, o pasibraukimas ir perskaitymas — beveik neveikia.","en":"Hosted by The Learning Scientists — a group of cognitive scientists (Megan Sumeracki and colleagues) who started from a Twitter account a decade ago and grew into one of the best-known evidence-based learning resources anywhere.\n\nThe content lines up directly with MKK's spine: retrieval practice, spaced repetition, interleaving, dual coding, concrete examples, elaborative interrogation. The same six strategies, explained at length with real classroom examples.\n\n**For:** parents and teachers comfortable in English who want the longer explanation, not the short version."},"source":{"name":"The Learning Scientists","url":"https://www.learningscientists.org/","lang":"en"},"grade":"A","age":"4-14","tone":"#D8B4B0","status":"published"},{"id":"podcast-cult-of-pedagogy","type":"podcast","title":{"lt":"Cult of Pedagogy — praktiniai patarimai iš tikrų mokytojų","en":"Cult of Pedagogy — practical advice from real teachers"},"summary":{"lt":"Kiekvienas epizodas — vienas konkretus dalykas, kurį gali pritaikyti kitą dieną.","en":"Every episode is one concrete thing you can use the next day."},"body":{"lt":"Jennifer Gonzalez, buvusi mokytoja, veda podcast'ą, kuris verčia mokymosi mokslą į konkrečius, pritaikomus žingsnius mokytojams ir tėvams — be žargono.\n\nSkiriasi nuo Learning Scientists tuo, kad mažiau kalba apie „kodėl veikia“, daugiau — apie „kaip tai atrodo klasėje ar prie stalo namuose rytoj“.\n\n**Kam:** tėvams ir mokytojams, kurie jau žino teoriją ir ieško konkretaus, pritaikomo žingsnio — ne dar vieno paaiškinimo, kodėl atmintis svarbi.","en":"Jennifer Gonzalez, a former teacher, hosts a podcast that turns learning science into concrete, usable steps for teachers and parents — no jargon.\n\nDifferent from The Learning Scientists in that it spends less time on \"why it works\" and more on \"what this looks like in a classroom or at the kitchen table tomorrow\".\n\n**For:** parents and teachers who already know the theory and want one concrete, usable step — not another explanation of why memory matters."},"source":{"name":"Cult of Pedagogy","url":"https://www.cultofpedagogy.com/pod/","lang":"en"},"grade":"C","age":"4-14","tone":"#E0B96B","status":"published"},{"id":"video-screenagers","type":"video","title":{"lt":"Screenagers — dokumentika apie ekranus, dėmesį ir šeimą","en":"Screenagers — a documentary on screens, attention and family"},"summary":{"lt":"Gydytoja ir filmuotoja Dr. Delaney Ruston filmuoja savo šeimą ir kitas apie ekranus.","en":"Physician-filmmaker Dr. Delaney Ruston films her own family on screen habits."},"body":{"lt":"Dr. Delaney Ruston, gydytoja ir dokumentininkė, filmuoja savo pačios šeimą ir kitas šeimas, kovojančias su tuo pačiu klausimu: kiek ekrano yra per daug, ir kaip apie tai kalbėtis su vaiku, o ne prieš jį.\n\nFilmas neduoda vienos taisyklės visiems. Vietoj to rodo realius pokalbius, realius nesutarimus tarp tėvų ir paauglių, ir mokslininkų komentarus apie dėmesį bei miegą.\n\n**Kam:** tėvams su 10–14 metų vaikais, žiūrėti KARTU su paaugliu, tada kalbėtis — ne filmą naudoti kaip argumentą prieš jį.\n\n⚠️ Pilnas filmas — mokamas nuomai/peržiūrai (screenagersmovie.com). Trailer'is nemokamas YouTube.","en":"Dr. Delaney Ruston, a physician and filmmaker, films her own family and other families wrestling with the same question: how much screen time is too much, and how to talk about it WITH a child, not against them.\n\nThe film doesn't hand down one rule for everyone. Instead it shows real conversations, real disagreements between parents and teens, and researcher commentary on attention and sleep.\n\n**For:** parents with 10–14 year olds, to watch TOGETHER with the teen, then talk — not to use as ammunition against them.\n\n⚠️ The full film is paid rental/streaming (screenagersmovie.com). The trailer is free on YouTube."},"source":{"name":"Dr. Delaney Ruston — Screenagers","url":"https://www.youtube.com/watch?v=LQx2X0BXgZg","lang":"en"},"grade":"B","age":"10-14","tone":"#9FB3C8","status":"published"},{"id":"video-ted-ed-memory","type":"video","title":{"lt":"TED-Ed: kaip formuojasi prisiminimai ir kodėl juos pamirštame","en":"TED-Ed: how memories form and how we lose them"},"summary":{"lt":"5 minučių animuota pamoka apie atmintį — tinka žiūrėti kartu su vaiku.","en":"A 5-minute animated lesson on memory — good to watch together with a child."},"body":{"lt":"Catharine Young paaiškina, kaip smegenys pagamina, saugo ir kartais pameta prisiminimus — animuota, trumpa, be žargono.\n\nTinka kaip pirmas žingsnis prieš „prisiminimas be žiūrėjimo“ techniką MKK viduje: vaikas pamato, KODĖL prisiminti sunkiau nei perskaityti, ir kad pamiršti — normalu, ne gėda.\n\n**Kam:** vaikams nuo 8 metų kartu su tėvais, kaip 5 minučių įžanga prieš pokalbį apie tai, kaip jų pačių atmintis veikia.\n\n⚠️ Lietuviškų subtitrų šiuo metu nėra — tik anglų (arba automatinis vertimas per YouTube nustatymus).","en":"Catharine Young explains how the brain makes, stores, and sometimes loses memories — animated, short, no jargon.\n\nWorks well as a first step before the \"retrieval practice\" technique inside MKK: the child sees WHY recalling is harder than rereading, and that forgetting is normal, not shameful.\n\n**For:** kids from age 8 with a parent, as a 5-minute lead-in to a conversation about how their own memory works.\n\n⚠️ No Lithuanian subtitles currently exist — English only (or YouTube's auto-translate)."},"source":{"name":"TED-Ed — Catharine Young","url":"https://www.youtube.com/watch?v=yOgAbKJGrTA","lang":"en"},"grade":"B","age":"8-14","tone":"#D8B4B0","status":"published"},{"id":"video-oakley-talks-at-google","type":"video","title":{"lt":"Barbara Oakley „Talks at Google“ — kaip mokytis mokytis","en":"Barbara Oakley at \"Talks at Google\" — learning how to learn"},"summary":{"lt":"Inžinierė, kuri pati užaugo galvodama, kad „nesugeba“ matematikos.","en":"An engineer who grew up thinking she \"couldn't do\" math."},"body":{"lt":"Barbara Oakley, inžinerijos profesorė ir vieno populiariausio pasaulyje MOOC „Learning How to Learn“ (kartu su Terrence Sejnowski) autorė, pasakoja, kaip pati perėjo nuo „nesugebu matematikos“ iki inžinerijos daktaro laipsnio.\n\nPaskaita paaiškina „fokusuoto“ ir „išsklaidyto“ mąstymo režimus — kodėl pertrauka kartais išsprendžia užduotį greičiau nei sėdėjimas prie jos.\n\n**Kam:** paaugliams 13+ ir tėvams, kurie patys galvoja, kad „nemoka mokytis“ — vienas honest admission po kito, ne pamokymas iš aukšto.\n\n⚠️ Anglų kalba, be lietuviškų subtitrų.","en":"Barbara Oakley, professor of engineering and co-author of one of the world's most popular MOOCs, \"Learning How to Learn\" (with Terrence Sejnowski), tells the story of going from \"I can't do math\" to a doctorate in engineering.\n\nThe talk explains \"focused\" and \"diffuse\" thinking modes — why a break sometimes solves a problem faster than sitting at the desk.\n\n**For:** teens 13+ and parents who think of themselves as \"not good at learning\" — one honest admission after another, not a lecture from above.\n\n⚠️ English only, no Lithuanian subtitles."},"source":{"name":"Barbara Oakley — Talks at Google","url":"https://www.youtube.com/watch?v=vd2dtkMINIw","lang":"en"},"grade":"A","age":"13-14","tone":"#E0B96B","status":"published"},{"id":"connectors","type":"article","title":{"lt":"Kur mane rasti","en":"Where to find me"},"summary":{"lt":"Kristijonas viešuose kanaluose — jokio pardavimo, tik kur sekti toliau.","en":"Kristijonas's public channels — no selling, just where to follow along."},"body":{"lt":"Interesų konfliktas: esu ExoClass bendraįkūrėjas ir turiu robotikos būrelį. MKK nemokamas VISIEMS būreliams, ne tik mano.\n\nJei nori sekti daugiau apie mokymosi mokslą, robotiką ir tai, ką statau toliau:\n\n- **Svetainė:** [krisvas.lt](https://krisvas.lt)\n- **LinkedIn:** [linkedin.com/in/kristijonasvasiliauskas](https://www.linkedin.com/in/kristijonasvasiliauskas/)\n- **Instagram:** [@kristijonas.vas](https://www.instagram.com/kristijonas.vas/)\n- **TikTok:** [@krisvas369](https://www.tiktok.com/@krisvas369)\n- **YouTube:** [@KristijonasVasiliauskas](https://www.youtube.com/@KristijonasVasiliauskas/shorts)\n\n⚠️ Naujienlaiškio šiuo metu neturiu. Rašau apie tai, ką pats bandau, klystu ir taisau — ne apie tai, kas skamba gražiai.","en":"Conflict of interest: I'm an ExoClass co-founder and I own a robotics club. MKK is free for EVERY after-school club, not just mine.\n\nIf you want to follow more on learning science, robotics, and what I'm building next:\n\n- **Website:** [krisvas.lt](https://krisvas.lt)\n- **LinkedIn:** [linkedin.com/in/kristijonasvasiliauskas](https://www.linkedin.com/in/kristijonasvasiliauskas/)\n- **Instagram:** [@kristijonas.vas](https://www.instagram.com/kristijonas.vas/)\n- **TikTok:** [@krisvas369](https://www.tiktok.com/@krisvas369)\n- **YouTube:** [@KristijonasVasiliauskas](https://www.youtube.com/@KristijonasVasiliauskas/shorts)\n\n⚠️ No newsletter yet. I write about what I actually try, get wrong, and fix — not about what sounds good."},"source":{"name":"Kristijonas Vasiliauskas","url":"https://krisvas.lt","lang":"lt"},"grade":"C","age":"4-14","tone":"#9BB59C","status":"published"}],"people":[{"name":"Pooja K. Agarwal","role":{"lt":"Kognityvinė mokslininkė, retrievalpractice.org įkūrėja","en":"Cognitive scientist, founder of retrievalpractice.org"},"why":{"lt":"Ji pavertė „prisiminimo be žiūrėjimo“ tyrimus į įrankius, kuriuos mokytojas gali naudoti rytoj, ne po metų skaitymo. MKK top3 skiltis stovi ant jos surinktų įrodymų.","en":"She turned retrieval-practice research into tools a teacher can use tomorrow, not after a year of reading. MKK's top-3 section stands on the evidence she compiled."},"links":[{"label":"retrievalpractice.org","url":"https://www.retrievalpractice.org/"}],"lang":"en","lt":false},{"name":"Ramunė Dirvanskienė","role":{"lt":"Neuropsichologė, knygos „Kaip veikia smegenys“ autorė","en":"Neuropsychologist, author of \"How the Brain Works\""},"why":{"lt":"Viena nedaugelio lietuvių autorių, parašiusių originalią (ne verstą) knygą apie smegenis plačiajai auditorijai. ⚠️ Pats neperskaičiau visos knygos įrodymų kokybės — patikrink prieš rekomenduodamas toliau.","en":"One of few Lithuanian authors who wrote an original (not translated) popular book on the brain. ⚠️ I haven't personally checked the full book's evidence quality — verify before recommending it further."},"links":[{"label":"Knyga „Kaip veikia smegenys“","url":"https://www.knyguklubas.lt/kaip-veikia-smegenys"}],"lang":"lt","lt":true},{"name":"Karolina Gurskienė","role":{"lt":"Psichologė, rašo apie vaikus, ekranus ir tėvystę","en":"Psychologist, writes about children, screens and parenting"},"why":{"lt":"Rašo tavovaikas.lt apie tai, kaip tėvai realiai gali dozuoti ekraną be karo namie — be baimės kultūros, su konkrečiais žingsniais.","en":"Writes for tavovaikas.lt about how parents can realistically ration screens without a war at home — no fear-mongering, concrete steps instead."},"links":[{"label":"psichologastau.lt","url":"https://psichologastau.lt/"}],"lang":"lt","lt":true},{"name":"Urtė Neniškytė","role":{"lt":"Neuromokslininkė, VU Gyvybės mokslų centras","en":"Neuroscientist, Vilnius University Life Sciences Center"},"why":{"lt":"Viešai ir garsiai sako, kad „mokymosi stiliai“ — mitas, kai daugelis bijo tai pasakyti tėvams. Tiksliai ta drąsa sakyti neigiamą radinį, kurios MKK laikosi.","en":"Says loudly and publicly that \"learning styles\" is a myth, when most people are afraid to tell parents that. Exactly the courage to state a negative finding that MKK tries to hold onto."},"links":[{"label":"VU profilis","url":"https://www.gmc.vu.lt/mokslas/mokslininku-profiliai/dr-urte-neniskyte"}],"lang":"lt","lt":true},{"name":"Barbara Oakley","role":{"lt":"Inžinerijos profesorė, „Learning How to Learn“ (Coursera) bendraautorė","en":"Professor of engineering, co-author of \"Learning How to Learn\" (Coursera)"},"why":{"lt":"Pati užaugo galvodama, kad „nesugeba“ matematikos, ir tapo inžinerijos daktare. Jos „fokusuoto/išsklaidyto mąstymo“ modelis — vienas geriausių paaiškinimų, kodėl pertrauka padeda, o ne trukdo.","en":"Grew up thinking she \"couldn't do\" math and became a doctor of engineering. Her \"focused/diffuse thinking\" model is one of the best explanations for why a break helps rather than hurts."},"links":[{"label":"barbaraoakley.com","url":"https://barbaraoakley.com/"}],"lang":"en","lt":false},{"name":"Emilija Petraitytė","role":{"lt":"Medicinos psichologė, rašo apie vaikų dėmesį","en":"Medical psychologist, writes about children's attention"},"why":{"lt":"Aiškina dėmesį kaip įgūdį, kuris auga per santykį ir akių kontaktą, ne kaip diagnozę, kurią reikia „sutvarkyti“ programėle.","en":"Frames attention as a skill that grows through relationship and eye contact, not as a diagnosis an app needs to \"fix\"."},"links":[{"label":"tavovaikas.lt straipsnis","url":"https://tavovaikas.lt/mokslai/med-psichologe-emilija-petraityte-kaip-padeti-vaikui-auginti-demesio-supergalia"},{"label":"Instagram @rami_erdve","url":"https://www.instagram.com/rami_erdve/"}],"lang":"lt","lt":true},{"name":"Irena Stonkuvienė","role":{"lt":"Edukologė, VU profesorė","en":"Education researcher, VU professor"},"why":{"lt":"Kalba apie mokymąsi ir mokyklos kultūrą iš tyrimų, ne iš nostalgijos — geras atsvaras „anksčiau mokykla buvo geresnė“ kalboms.","en":"Talks about learning and school culture from research, not nostalgia — a good counterweight to \"school used to be better\" talk."},"links":[{"label":"VU Filosofijos fakultetas","url":"https://www.fsf.vu.lt/ugdymo-mokslu-institutas/ugdymo-mokslu-instituto-nariai/2322-irena-stonkuviene"}],"lang":"lt","lt":true},{"name":"Megan Sumeracki (The Learning Scientists)","role":{"lt":"Kognityvinė psichologė, „The Learning Scientists“ bendraįkūrėja","en":"Cognitive psychologist, co-founder of The Learning Scientists"},"why":{"lt":"Pradėjo nuo Twitter paskyros ir per dešimtmetį pavertė mokymosi mokslą paveikslėliais ir plakatais, kuriuos gali naudoti bet kuris mokytojas be mokslo laipsnio.","en":"Started from a Twitter account and, over a decade, turned learning science into posters and visuals any teacher can use without a research degree."},"links":[{"label":"learningscientists.org","url":"https://www.learningscientists.org/"}],"lang":"en","lt":false},{"name":"Inga Truskauskaitė","role":{"lt":"Psichologė, VU Psichotraumatologijos centras","en":"Psychologist, VU Psychotraumatology Center"},"why":{"lt":"Paaiškina, kas iš tikrųjų vyksta smegenyse per nenutrūkstamą naršymą — be moralizavimo, su mechanizmu. Naudinga, kai vaikas sako „bet aš tik žiūriu“.","en":"Explains what's actually happening in the brain during nonstop scrolling — no moralizing, just the mechanism. Useful when a child says \"but I'm just watching\"."},"links":[{"label":"LRT straipsnis","url":"https://www.lrt.lt/naujienos/mokslas-ir-it/11/2939113/pudo-smegenis-psichologe-apie-nenutrukstamo-narsymo-poveiki-zmogui"}],"lang":"lt","lt":true},{"name":"Matthew Walker","role":{"lt":"Miego neuromokslininkas, knygos „Why We Sleep“ autorius","en":"Sleep neuroscientist, author of \"Why We Sleep\""},"why":{"lt":"Populiarino miego ir atminties ryšį plačiajai auditorijai. ⚠️ Kai kurie jo knygos teiginiai buvo kritikuoti dėl netikslių citavimų (2019–2020 diskusija) — skaityk kartu su kritika, ne vien knygą.","en":"Popularized the sleep–memory link for a broad audience. ⚠️ Some claims in his book were criticized for inaccurate citations (2019–2020 debate) — read alongside the critique, not the book alone."},"links":[{"label":"sleepdiplomat.com","url":"https://www.sleepdiplomat.com/"}],"lang":"en","lt":false},{"name":"Daniel Willingham","role":{"lt":"Kognityvinis psichologas, knygos „Why Don't Students Like School?“ autorius","en":"Cognitive psychologist, author of \"Why Don't Students Like School?\""},"why":{"lt":"Verčia kognityvinį mokslą į paprastus atsakymus mokytojams ir tėvams klausimams, kurie kyla kiekvienoje klasėje — kodėl vaikas „nemėgsta mąstyti“.","en":"Translates cognitive science into plain answers for teachers and parents to the questions that come up in every classroom — why a child \"doesn't like to think\"."},"links":[{"label":"danielwillingham.com","url":"https://www.danielwillingham.com/"}],"lang":"en","lt":false}],"sourcesLt":[{"technique_id":"sleep","name":"LRT — Kodėl vaikams prastėja atmintis ir ką daryti, kad ji pasitaisytų","url":"https://www.lrt.lt/naujienos/mokslas-ir-it/11/1718741/kodel-vaikams-prasteja-atmintis-ir-ka-daryti-kad-ji-pasitaisytu","lang":"lt","note":"Vaikų miego trūkumo poveikis atminčiai ir vieno tyrimo duomenys (10–14 m., ~20 % geriau po miego)."},{"technique_id":"sleep-window","name":"LRT — Kodėl vaikams prastėja atmintis ir ką daryti, kad ji pasitaisytų","url":"https://www.lrt.lt/naujienos/mokslas-ir-it/11/1718741/kodel-vaikams-prasteja-atmintis-ir-ka-daryti-kad-ji-pasitaisytu","lang":"lt","note":"Rekomenduojama miego trukmė 6–13 m. vaikams ir kodėl vakaro pasikartojimas prieš miegą sustiprina naują medžiagą."},{"technique_id":"move","name":"LRT — Ne tik kūno, bet ir smegenų treniruotė","url":"https://www.lrt.lt/naujienos/gyvenimas/13/1265938/ne-tik-kuno-bet-ir-smegenu-treniruote-judejimas-gerina-atminti-gydo-nerima-ir-mazina-stresa","lang":"lt","note":"Kodėl judesys prieš protinę užduotį pagerina koncentraciją ir atmintį — mechanizmo paaiškinimas lietuviškai."},{"technique_id":"break-move","name":"LRT — Sportuojantys vaikai ne tik ištvermingesni, bet ir geriau mokosi","url":"https://www.lrt.lt/naujienos/laisvalaikis/13/1654488/sportuojantys-vaikai-ne-tik-istvermingesni-bet-ir-geriau-mokosi-kaip-pratinti-atzalas-sportuoti","lang":"lt","note":"Ryšys tarp fizinio aktyvumo pertraukų ir mokymosi rezultatų vaikams — palaiko pertraukos su judesiu praktiką."},{"technique_id":"phone-away","name":"Technaujienos.lt — kodėl išmanųjį telefoną reikia palikti kuo toliau","url":"https://www.technaujienos.lt/sokiruojantis-tyrimas-stai-kodel-ismanuji-telefona-reikia-palikti-kuo-toliau-priezastis-visai-ne-radiacijoje/","lang":"lt","note":"Lietuviška Teksaso universiteto (Ward ir kt. 2017) tyrimo apžvalga: telefonas kitame kambaryje > kišenėje > ant stalo."},{"technique_id":"spacing","name":"Mokykla2030 — Kartojimas su tarpais: protingiausias būdas mokytis","url":"https://mokykla2030.lt/kartojimas-su-tarpais-protingiausias-b%C5%ABdas-mokytis/","lang":"lt","note":"Lietuviškas paaiškinimas, kaip ir kodėl veikia kartojimas su intervalais, su praktiniais patarimais tėvams."},{"technique_id":"retrieval","name":"Mokykla2030 — Efektyvūs mokymosi metodai mokyklinio amžiaus vaikams","url":"https://mokykla2030.lt/efektyv%C5%ABs-mokymosi-metodai-mokyklinio-am%C5%BEiaus-vaikams/","lang":"lt","note":"15 technikų apžvalga lietuviškai, prisiminimą be žiūrėjimo (aktyvų atgaminimą) rikiuoja tarp stipriausių."},{"technique_id":"success","name":"Mokykla2030 — Efektyvūs mokymosi metodai mokyklinio amžiaus vaikams","url":"https://mokykla2030.lt/efektyv%C5%ABs-mokymosi-metodai-mokyklinio-am%C5%BEiaus-vaikams/","lang":"lt","note":"Ta pati apžvalga aptaria, kodėl per sunkios užduotys mažina, o ne didina mokymosi efektą."},{"technique_id":"feedback-work","name":"Mokykla2030 — Kaip tinkamai pagirti vaiką","url":"https://mokykla2030.lt/kai   /* ---------- ambient sound (Web Audio, generated) ---------- */
  var AU = { ctx: null, src: null, gain: null, lfo: null };
  function noiseBuffer(ctx) {
    var len = ctx.sampleRate * 4, buf = ctx.createBuffer(1, len, ctx.sampleRate), d = buf.getChannelData(0);
    var b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, i, w;
    for (i = 0; i < len; i++) {
      w = Math.random() * 2 - 1;
      b0 = 0.99886 * b0 + w * 0.0555179;
      b1 = 0.99332 * b1 + w * 0.0750759;
      b2 = 0.96900 * b2 + w * 0.1538520;
      b3 = 0.86650 * b3 + w * 0.3104856;
      b4 = 0.55000 * b4 + w * 0.5329522;
      b5 = -0.7616 * b5 - w * 0.0168980;
      d[i] = (b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362) * 0.11;
      b6 = w * 0.115926;
    }
    return buf;
  }
  function ambientStop() {
    try { if (AU.src) AU.src.stop(); } catch (e) {}
    try { if (AU.lfo) AU.lfo.stop(); } catch (e) {}
    AU.src = null; AU.lfo = null;
  }
  function ambientStart(kind) {
    ambientStop();
    if (kind === 'off') return;
    try {
      if (!AU.ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        AU.ctx = new AC();
      }
      if (AU.ctx.state === 'suspended') AU.ctx.resume();
      var ctx = AU.ctx;
      var src = ctx.createBufferSource();
      src.buffer = noiseBuffer(ctx); src.loop = true;
      var f = ctx.createBiquadFilter();
      var g = ctx.createGain();
      if (kind === 'rain') { f.type = 'bandpass'; f.frequency.value = 1400; f.Q.value = 0.6; g.gain.value = 0.5; }
      else if (kind === 'pulse') { f.type = 'lowpass'; f.frequency.value = 500; g.gain.value = 0.22; }
      else { f.type = 'lowpass'; f.frequency.value = 900; g.gain.value = 0.3; }
      src.connect(f); f.connect(g); g.connect(ctx.destination);
      if (kind === 'pulse') {
        var lfo = ctx.createOscillator(), lg = ctx.createGain();
        lfo.frequency.value = 0.12; lg.gain.value = 0.16;
        lfo.connect(lg); lg.connect(g.gain); lfo.start();
        AU.lfo = lfo;
      }
      src.start();
      AU.src = src; AU.gain = g;
    } catch (e) { /* audio is optional */ }
  }
  function beep() {
    try {
      if (!AU.ctx) { var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; AU.ctx = new AC(); }
      var ctx = AU.ctx, o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 528; o.type = 'sine';
      g.gain.setValueAtTime(0.0001, ctx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.14, ctx.currentTime + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 1.1);
      o.connect(g); g.connect(ctx.destination); o.start(); o.stop(ctx.currentTime + 1.2);
    } catch (e) {}
  }

  /* ---------- neuron canvas (low stimulation: 18 nodes, ~30fps, static if reduced) ---------- */
  function neurons() {
    var cv = $('#net'); if (!cv || !cv.getContext) return;
    var ctx = cv.getContext('2d'), N = [], i, W, H;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    function size() {
      W = cv.width = Math.round(cv.clientWidth * dpr);
      H = cv.height = Math.round(cv.clientHeight * dpr);
    }
    size();
    for (i = 0; i < 18; i++) N.push({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .22, vy: (Math.random() - .5) * .22 });
    function col() {
      var c = getComputedStyle(document.documentElement).getPropertyValue('--net').trim();
      return c || '10,10,10';
    }
    var last = 0, cache = col(), cacheAt = 0;
    function frame(ts) {
      if (!reduce) {
        if (ts - last < 33) { requestAnimationFrame(frame); return; }  /* ~30fps */
        last = ts;
      }
      if (ts - cacheAt > 1000) { cache = col(); cacheAt = ts; }
      var a, b, d, j;
      ctx.clearRect(0, 0, W, H);
      for (i = 0; i < N.length; i++) {
        a = N[i];
        if (!reduce) { a.x += a.vx; a.y += a.vy; }
        if (a.x < 0 || a.x > W) a.vx *= -1;
        if (a.y < 0 || a.y > H) a.vy *= -1;
        ctx.fillStyle = 'rgba(' + cache + ',1)';
        ctx.beginPath(); ctx.arc(a.x, a.y, 2.2, 0, 6.3); ctx.fill();
      }
      for (i = 0; i < N.length; i++) {
        for (j = i + 1; j < N.length; j++) {
          a = N[i]; b = N[j];
          d = Math.hypot(a.x - b.x, a.y - b.y);
          if (d < W / 4) {
            ctx.strokeStyle = 'rgba(' + cache + ',' + (1 - d / (W / 4)) * 0.5 + ')';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
          }
        }
      }
      if (!reduce) requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    var rt;
    window.addEventListener('resize', function () {
      clearTimeout(rt);
      rt = setTimeout(function () { size(); if (reduce) requestAnimationFrame(frame); }, 150);
    });
  }

  /* markdown-lite: blank line = paragraph · "- " = bullet · **bold** */

    for (i = 0; i < lines.length; i++) {

      if (l.indexOf('- ') === 0 || l.indexOf('· ') === 0) {

        h += '<li>' + inline(l.slice(2)) + '</li>';

  /* update in place — never re-render the sheet on a tick (60fps rule) */
  function readingTick() {
    RD.left--;
    var c = $('#rclk'), b = $('#rbar');
    if (!c) { stopReading(); return; }
    var m = Math.floor(RD.left / 60), s = RD.left % 60;
    c.textContent = m + ':' + (s < 10 ? '0' : '') + s;
    if (b) b.style.width = ((60 - RD.left) / 60 * 100) + '%';
    if (RD.left <= 0) {
      stopReading(); beep();
      var g = $('#rgo'); if (g) { g.textContent = 'Minutė baigta'; g.disabled = true; }
      toast('Minutė baigta. Dabar pasakyk vieną dalyką iš to, ką perskaitei.');
    }
  }

  /* ---------- games ---------- */
  var GM = {};
  function gameMount(id) {
    var box = $('#gameBox'); if (!box) return;
    if (id === 'atsimink') gAtsimink(box);
    else if (id === 'laikmatis') gLaikmatis(box);
    else if (id === 'ismokyk') gIsmokyk(box);
  }

  function gAtsimink(box) {
    var pools = C.games.memoryPools;
    var pool = isYoung() ? pools.young : pools.old;
    var st = P.games.atsimink || {};
    var repeatAvail = st.date && st.date !== today() && st.items && st.items.length === 5;
    GM.sel = [];

    function intro() {
      var h = '<span class="lbl">Prisiminimo praktika</span>';
      if (repeatAvail) {
        h += '<p class="sm">Vakar buvai įsiminęs penkis. Patikrinkim, ar liko — tai ir yra išskirstytas kartojimas.</p>' +
          '<button class="btn" data-g="repeat" type="button">🔁 Vakar dienos patikrinimas</button>' +
          '<button class="btn ghost" data-g="new" type="button">Nauji penki</button>';
      } else {
        h += '<p class="sm">5 daiktai · 10 sekundžių · paskui juos rasi tarp dešimties.</p>' +
          '<button class="btn" data-g="new" type="button">Pradėti</button>';
      }
      box.innerHTML = h;
    }
    function show(items) {
      GM.items = items;
      var left = 10, h = '<span class="lbl">Įsimink</span><div class="clock" id="gclk">10</div><div class="bar"><i id="gbar"></i></div><div class="grid5">';
      items.forEach(function (x) { h += '<div class="cell">' + esc(x) + '</div>'; });
      h += '</div><button class="btn ghost" data-g="hide" type="button">Jau įsiminiau</button>';
      box.innerHTML = h;
      clearInterval(GM.t);
      GM.t = setInterval(function () {
        left--;
        var c = $('#gclk'), b = $('#gbar');
        if (!c) { clearInterval(GM.t); return; }
        c.textContent = left;
        if (b) b.style.width = ((10 - left) * 10) + '%';
        if (left <= 0) { clearInterval(GM.t); quiz(); }
      }, 1000);
    }
    function quiz() {
      clearInterval(GM.t);
      var rest = pool.filter(function (x) { return GM.items.indexOf(x) < 0; });
      var decoys = shuffle(rest).slice(0, 5);
      GM.board = shuffle(GM.items.concat(decoys));
      GM.sel = [];
      render();
    }
    function render() {
      var h = '<span class="lbl">Rask tuos penkis · pažymėta <span id="gsel">0</span>/5</span><div class="grid5">';
      GM.board.forEach(function (x, i) {
        h += '<button class="cell" data-g="pick" data-i="' + i + '" aria-pressed="false" type="button">' + esc(x) + '</button>';
      });
      h += '</div><button class="btn" id="gsub" disabled data-g="submit" type="button">Patikrinti</button>';
      box.innerHTML = h;
    }
    /* update in place — re-rendering the whole grid on every tap flickers on a phone */
    function refresh() {
      var n = box.querySelector('#gsel'), sub = box.querySelector('#gsub');
      if (n) n.textContent = GM.sel.length;
      if (sub) sub.disabled = GM.sel.length !== 5;
    }
    function result() {
      var right = 0, missed = [], h = '';
      GM.sel.forEach(function (i) { if (GM.items.indexOf(GM.board[i]) >= 0) right++; });
      GM.items.forEach(function (it) {
        var idx = GM.board.indexOf(it);
        if (GM.sel.indexOf(idx) < 0) missed.push(it);
      });
      P.games.atsimink = { date: today(), items: GM.items, missed: missed };
      save();
      h += '<span class="lbl">Rezultatas</span><div class="clock">' + right + '/5</div>';
      h += '<div class="grid5">';
      GM.board.forEach(function (x, i) {
        var was = GM.items.indexOf(x) >= 0, pick = GM.sel.indexOf(i) >= 0;
        var cls = was ? 'right' : (pick ? 'wrong' : '');
        h += '<div class="cell ' + cls + '">' + esc(x) + '</div>';
      });
      h += '</div>';
      h += '<p class="sm">' + (right === 5 ? 'Visi penki. Jei taip bus ir rytoj — laikas sunkesnio lygio: treniruotė veikia, kai pataikai 70–90 %, ne 100 %.' :
        right === 4 ? 'Geras lygis. Tarp 70 ir 90 % teisingų — ten, kur treniruotė dar yra treniruotė.' :
          right >= 2 ? 'Normalu. Rytoj tie patys penki bus lengvesni — tai ir yra visa technika.' :
            'Per sunku. Rytoj bandom vėl — ir tai ne apie gabumus, o apie kartojimą.') + '</p>';
      if (missed.length) h += '<p class="meta">Nepataikei: ' + esc(missed.join(' · ')) + ' — jie grįš rytoj.</p>';
      h += '<div class="spacer"></div><button class="btn ghost" data-g="new" type="button">Dar kartą</button>';
      box.innerHTML = h;
    }
    box.onclick = function (e) {
      var b = e.target.closest ? e.target.closest('[data-g]') : null;
      if (!b) return;
      var g = b.getAttribute('data-g');
      if (g === 'new') show(shuffle(pool).slice(0, 5));
      else if (g === 'repeat') show(st.items.slice());
      else if (g === 'hide') { clearInterval(GM.t); quiz(); }
      else if (g === 'pick') {
        var i = parseInt(b.getAttribute('data-i'), 10), at = GM.sel.indexOf(i);
        if (at >= 0) { GM.sel.splice(at, 1); b.setAttribute('aria-pressed', 'false'); }
        else if (GM.sel.length < 5) { GM.sel.push(i); b.setAttribute('aria-pressed', 'true'); }
        refresh();
      } else if (g === 'submit') result();
    };
    intro();
  }

  function gLaikmatis(box) {
    GM.left = 0; GM.run = false; GM.checks = {};
    function fmt(s) { var m = Math.floor(s / 60), r = s % 60; return m + ':' + (r < 10 ? '0' : '') + r; }
    function draw() {
      var h = '';
      if (!GM.run && !GM.left) {
        h += '<span class="lbl">Kiek minučių?</span><div class="btnrow">' +
          '<button class="btn" data-g="start" data-m="2" type="button">2</button>' +
          '<button class="btn" data-g="start" data-m="5" type="button">5</button>' +
          '<button class="btn" data-g="start" data-m="10" type="button">10</button></div>';
      } else {
        h += '<span class="lbl" id="tst">' + (GM.run ? 'Vienas darbas. Nieko kito.' : 'Pauzė') + '</span>' +
          '<div class="clock" id="tclk">' + fmt(GM.left) + '</div>' +
          '<div class="bar"><i id="tbar" style="width:' + (100 - Math.round(GM.left / GM.total * 100)) + '%"></i></div>' +
          '<div class="btnrow"><button class="btn ghost" data-g="toggle" type="button" id="ttog">' + (GM.run ? 'Pauzė' : 'Tęsti') + '</button>' +
          '<button class="btn ghost" data-g="stop" type="button">Baigti</button></div>';
      }
      h += '<hr class="sep"><span class="lbl">Prieš pradedant</span>';
      C.games.timerChecklist.forEach(function (t, i) {
        h += '<button class="check' + (GM.checks[i] ? ' on' : '') + '" data-g="chk" data-i="' + i + '" type="button">' +
          '<span class="bx">' + (GM.checks[i] ? '✓' : '') + '</span><span>' + esc(t) + '</span></button>';
      });
      h += '<div class="spacer"></div><button class="btn ghost sm" data-g="gray" type="button">' +
        (document.body.classList.contains('grayscale') ? 'Grąžinti spalvas' : '⚫ Pilko ekrano iššūkis') + '</button>';
      box.innerHTML = h;
    }
    /* 60fps: a tick touches two nodes, never innerHTML */
    function paint() {
      var c = box.querySelector('#tclk'), b = box.querySelector('#tbar');
      if (c) c.textContent = fmt(GM.left);
      if (b) b.style.width = (100 - Math.round(GM.left / GM.total * 100)) + '%';
    }
    function tick() {
      if (!GM.run) return;
      GM.left--;
      if (GM.left <= 0) {
        GM.run = false; GM.left = 0; clearInterval(GM.t); beep(); draw();
        toast('Laikas. Dabar pasakyk vieną dalyką iš atminties.'); return;
      }
      paint();
    }
    box.onclick = function (e) {
      var b = e.target.closest ? e.target.closest('[data-g]') : null;
      if (!b) return;
      var g = b.getAttribute('data-g');
      if (g === 'start') {
        GM.total = parseInt(b.getAttribute('data-m'), 10) * 60;
        GM.left = GM.total; GM.run = true;
        clearInterval(GM.t); GM.t = setInterval(tick, 1000); draw();
      } else if (g === 'toggle') {
        GM.run = !GM.run;
        clearInterval(GM.t); if (GM.run) GM.t = setInterval(tick, 1000);
        draw();
      } else if (g === 'stop') { GM.run = false; GM.left = 0; clearInterval(GM.t); draw(); }
      else if (g === 'chk') { var i = b.getAttribute('data-i'); GM.checks[i] = !GM.checks[i]; draw(); }
      else if (g === 'gray') { document.body.classList.toggle('grayscale'); draw(); }
    };
    draw();
  }

  function gIsmokyk(box) {
    var topics = C.games.teachTopics.filter(function (t) { return t.minAge <= bandMinAge() + 2; });
    if (!topics.length) topics = C.games.teachTopics;
    GM.left = 60; GM.run = false;
    function pick() { GM.topic = topics[Math.floor(Math.random() * topics.length)].t; }
    pick();
    function draw(phase) {
      var h = '<span class="lbl">Tema</span><p class="big sm2">' + esc(GM.topic) + '</p>';
      if (phase === 'run') {
        h += '<div class="clock" id="iclk">' + GM.left + '</div><div class="bar"><i id="ibar" style="width:' + ((60 - GM.left) / 60 * 100) + '%"></i></div>' +
          '<p class="sm muted">Kalbėk garsiai. Be užrašų. Jei sustoji — vis tiek kalbėk.</p>' +
          '<button class="btn ghost" data-g="stop" type="button">Baigiau</button>';
      } else if (phase === 'rate') {
        h += '<span class="lbl">Kaip sekėsi?</span>';
        C.games.teachRates.forEach(function (r) {
          h += '<button class="btn ghost" data-g="rate" data-n="' + r.n + '" type="button">' + esc(r.icon) + ' ' + esc(r.label) + '</button>';
        });
      } else if (phase === 'done') {
        var r = C.games.teachRates[GM.rate - 1];
        h += '<div class="clock">' + esc(r.icon) + '</div><p class="sm"><b>' + esc(r.label) + '</b></p>' +
          '<div class="prac">' + esc(r.tip) + '</div><div class="spacer"></div>' +
          '<button class="btn ghost" data-g="again" type="button">Kita tema</button>';
      } else {
        h += '<p class="sm muted">60 sekundžių. Aiškini garsiai — žmogui, meškiukui ar sienai. Be užrašų.</p>' +
          '<button class="btn" data-g="go" type="button">Pradedu</button>' +
          '<button class="btn ghost" data-g="again" type="button">Kita tema</button>';
      }
      box.innerHTML = h;
    }
    function tick() {
      GM.left--;
      if (GM.left <= 0) { clearInterval(GM.t); GM.run = false; beep(); draw('rate'); return; }
      var c = box.querySelector('#iclk'), b = box.querySelector('#ibar');
      if (c) c.textContent = GM.left;
      if (b) b.style.width = ((60 - GM.left) / 60 * 100) + '%';
    }
    box.onclick = function (e) {
      var b = e.target.closest ? e.target.closest('[data-g]') : null;
      if (!b) return;
      var g = b.getAttribute('data-g');
      if (g === 'go') { GM.left = 60; GM.run = true; clearInterval(GM.t); GM.t = setInterval(tick, 1000); draw('run'); }
      else if (g === 'stop') { clearInterval(GM.t); GM.run = false; draw('rate'); }
      else if (g === 'rate') { GM.rate = parseInt(b.getAttribute('data-n'), 10); draw('done'); }
      else if (g === 'again') { clearInterval(GM.t); GM.left = 60; pick(); draw(); }
    };
    draw();
  }

  /* ---------- install / platform ---------- */
  function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream; }
  function isStandalone() {
    return window.navigator.standalone === true ||
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  }
  function iosSheet() {
    sheet('📲 Pridėti į pradžios ekraną',
      '<p class="sm">MKK veikia be parduotuvės — įsidedi tiesiai iš naršyklės ir ji atsidaro kaip įprasta programėlė.</p>' +
      '<ol class="plain"><li>Apačioje paspausk <b>Dalintis</b> (kvadratas su rodykle ↑).</li>' +
      '<li>Slink žemyn iki <b>„Į pradžios ekraną“ / „Add to Home Screen“</b>.</li>' +
      '<li>Paspausk <b>Pridėti</b>. Ikona atsiras šalia kitų programėlių.</li></ol>' +
      '<p class="note">Veikia ir be interneto: podcast\'ai ir turinys lieka telefone.</p>', 'hero');
  }

  /* ---------- profile sheets ---------- */
  function profileSheet() {
    var h = '<p class="sm muted">Kiekvienas vaikas turi savo seriją, savo dienas ir savo amžiaus juostą.</p>';
    S.profiles.forEach(function (p) {
      var bb = null, i;
      for (i = 0; i < C.config.bands.length; i++) if (C.config.bands[i].id === p.band) bb = C.config.bands[i];
      h += '<button class="catrow" style="--tone:' + tone('age-' + p.band) + '" data-act="switch" data-id="' + esc(p.id) + '" type="button">' +
        '<span class="ic">' + illMini('age-' + p.band) + '</span>' +
        '<span class="tx"><b>' + esc(p.name || (bb ? bb.label : '—')) + '</b><span>' + esc(bb ? bb.label : '') + ' · 🔥 ' + p.streak + '</span></span>' +
        '<span class="ar">' + (p.id === S.active ? '✓' : '→') + '</span></button>';
    });
    h += '<div class="spacer"></div><button class="btn ghost" data-act="add-child" type="button">+ Pridėti vaiką</button>';
    sheet('👤 Kas mokosi', h, 'hero');
  }
  function addChildSheet() {
    var h = '<p class="sm muted">Vardas nebūtinas. Viskas lieka šitame telefone.</p>' +
      '<input type="text" id="newName" placeholder="Vardas (nebūtina)" autocomplete="off" maxlength="24">' +
      '<p class="lbl" style="margin-top:18px">Amžius</p><div class="chips" id="newBands">';
    C.config.bands.forEach(function (b) {
      h += '<button class="chip" data-act="new-band" data-band="' + esc(b.id) + '" aria-pressed="false" type="button">' + esc(b.label) + '</button>';
    });
    h += '</div><div class="spacer"></div><button class="btn" data-act="new-save" type="button" disabled id="newSave">Pridėti</button>';
    sheet('+ Pridėti vaiką', h, 'hero');
  }

  /* ---------- router ---------- */
  function route() {
    clearInterval(GM.t);
    var hash = location.hash.replace(/^#\/?/, '') || 'siandien';
    var parts = hash.split('/');
    var tab = parts[0] || 'siandien', sub = parts[1] || '';
    var v = $('#view'), html;

    if (!S.onboarded || !P || !P.band) { html = scrOnboard(); tab = 'siandien'; }
    else if (tab === 'treniruotes') html = scrTechniques(sub);
    else if (tab === 'zaidimai') html = scrGames(sub);
    else if (tab === 'tinklarastis' || tab === 'biblioteka') { tab = 'tinklarastis'; html = scrBlog(sub); }
    else if (tab === 'as') html = scrMe();
    else html = scrToday();

    v.innerHTML = html;
    window.scrollTo(0, 0);
    var tabs = document.querySelectorAll('#tabs .tab'), i;
    for (i = 0; i < tabs.length; i++) {
      if (tabs[i].getAttribute('data-t') === tab) tabs[i].setAttribute('aria-current', 'page');
      else tabs[i].removeAttribute('aria-current');
    }
    paintHeader();
    if (tab === 'zaidimai' && sub) gameMount(sub);
  }
  function paintHeader() {
    var btn = $('#profileBtn');
    $('#streakN').textContent = P ? P.streak : 0;
    if (!P || !S.onboarded) { btn.hidden = true; return; }
    var b = bandObj();
    btn.hidden = false;
    $('#profileAv').textContent = (P.name ? P.name.trim().charAt(0) : b.label.charAt(0)).toUpperCase();
    $('#profileAv').style.background = tone('age-' + P.band);
    $('#profileName').textContent = P.name || b.label;
  }

  /* ---------- actions ---------- */
  function markDone(field) {
    var d = dayState();
    d[field] = 1; save();
    var gained = checkStreak();
    closeSheet(); route();
    toast(gained ? t('sh.streakToast') + P.streak : t('sh.marked'));
  }

  function onClick(e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if (!el) return;
    var a = el.getAttribute('data-act');

    /* --- onboarding --- */
    if (a === 'ob-band') {
      var nm = $('#obName');
      if (nm) OB.name = nm.value;
      OB.band = el.getAttribute('data-band'); route(); return;
    }
    if (a === 'ob-time') { OB.time = el.getAttribute('data-time'); route(); return; }
    if (a === 'ob-next') {
      if (OB.step === 1) {
        var n2 = $('#obName'); if (n2) OB.name = n2.value.trim();
        if (!OB.band) { toast(t('ob.pickAge')); return; }
      }
      OB.step = Math.min(3, OB.step + 1); route(); return;
    }
    if (a === 'ob-skip') { OB.time = ''; OB.step = 3; route(); return; }
    if (a === 'ob-done') {
      var band = null, i;
      for (i = 0; i < C.config.bands.length; i++) if (C.config.bands[i].id === OB.band) band = C.config.bands[i];
      var p = newProfile(OB.band, OB.name, band ? band.parentMode === true : false);
      S.profiles.push(p); S.active = p.id; S.onboarded = true; S.remind = OB.time;
      pickActive(); save();
      location.hash = '#/siandien'; route();
      toast(t('ob.started'));
      return;
    }

    /* --- profiles --- */
    if (a === 'profile') { profileSheet(); return; }
    if (a === 'switch') {
      S.active = el.getAttribute('data-id'); pickActive(); save(); closeSheet();
      location.hash = '#/siandien'; route();
      toast('Mokosi: ' + (P.name || bandObj().label)); return;
    }
    if (a === 'add-child') { addChildSheet(); return; }
    if (a === 'new-band') {
      var chips = document.querySelectorAll('#newBands .chip'), k;
      for (k = 0; k < chips.length; k++) chips[k].setAttribute('aria-pressed', chips[k] === el ? 'true' : 'false');
      var sv = $('#newSave'); if (sv) sv.disabled = false;
      return;
    }
    if (a === 'new-save') {
      var sel = document.querySelector('#newBands .chip[aria-pressed="true"]');
      if (!sel) { toast('Pasirink amžių.'); return; }
      var bid = sel.getAttribute('data-band'), bo = null, j;
      for (j = 0; j < C.config.bands.length; j++) if (C.config.bands[j].id === bid) bo = C.config.bands[j];
      var np = newProfile(bid, ($('#newName') ? $('#newName').value.trim() : ''), bo ? bo.parentMode === true : false);
      S.profiles.push(np); S.active = np.id; pickActive(); save(); closeSheet();
      location.hash = '#/siandien'; route();
      toast('Pridėta: ' + (np.name || bo.label)); return;
    }
    if (a === 'del-child') {
      if (S.profiles.length < 2) return;
      sheet('Pašalinti šitą profilį?',
        '<p class="sm">Dings <b>' + esc(P.name || bandObj().label) + '</b> serija, dienos ir žaidimų istorija. Atgal nebus.</p>' +
        '<button class="btn" data-act="del-child2" type="button">Taip, pašalinti</button>', 'hero');
      return;
    }
    if (a === 'del-child2') {
      S.profiles = S.profiles.filter(function (p) { return p.id !== S.active; });
      S.active = S.profiles.length ? S.profiles[0].id : '';
      pickActive(); save(); closeSheet(); route(); toast('Pašalinta'); return;
    }

    /* --- settings --- */
    if (a === 'method') { methodSheet(); return; }
    if (a === 'ios') { iosSheet(); return; }
    if (a === 'band') {
      P.band = el.getAttribute('data-band');
      var b2 = bandObj();
      if (b2.parentMode) P.parent = true;
      save(); route(); toast('Amžius: ' + b2.label); return;
    }
    if (a === 'parent') { P.parent = !P.parent; save(); route(); return; }
    if (a === 'remind') { S.remind = el.getAttribute('data-time'); save(); route(); toast(S.remind ? 'Priminimas: ' + S.remind : 'Be priminimo'); return; }
    if (a === 'theme') { S.theme = el.getAttribute('data-theme'); save(); applyTheme(); route(); return; }
    if (a === 'lang') {
      S.lang = el.getAttribute('data-lang') === 'en' ? 'en' : 'lt';
      save(); applyLang(); route(); toast(t('sh.langSwitched')); return;
    }
    if (a === 'accent') { S.accent = el.getAttribute('data-accent'); save(); applyTheme(); route(); return; }
    if (a === 'amb') {
      S.ambient = el.getAttribute('data-amb'); save(); ambientStart(S.ambient); route();
      toast(S.ambient === 'off' ? 'Garsas išjungtas' : 'Fono garsas įjungtas'); return;
    }

    /* --- daily loop --- */
    if (a === 'start-now') { openPodcast(true); return; }
    if (a === 'open-pod') { openPodcast(false); return; }
    if (a === 'recall') {
      var n = parseInt(el.getAttribute('data-n'), 10);
      var au = $('#pod'); if (au) { try { au.pause(); } catch (er2) {} }
      markDone('p');
      toast(n >= 3 ? 'Trys iš trijų. Rytoj tas pats klausimas bus dar lengvesnis.' :
        n === 2 ? 'Du. Normalu — prisiminti sunkiau nei perskaityti, ir būtent todėl tai veikia.' :
          'Vienas. Tai ne gabumai, o kartojimas. Rytoj vėl.');
      return;
    }
    if (a === 'open-prac') { openPractice(); return; }
    if (a === 'open-read') { openReading(); return; }
    if (a === 'read-go') {
      stopReading(); RD.left = 60;
      el.textContent = 'Skaitom…'; el.disabled = true;
      RD.t = setInterval(readingTick, 1000);
      return;
    }
    if (a === 'did-read') {
      stopReading();
      var dd = dayState(); dd.r = 1; save(); closeSheet(); route();
      toast('📖 Minutė užskaityta. Serijos neskaičiuoja — ir taip ir turi būti.');
      return;
    }
    if (a === 'did-pod') { markDone('p'); return; }
    if (a === 'did-prac') { markDone('x'); return; }
    if (a === 'tick') { markDone('c'); return; }

    /* --- money --- */
    if (a === 'pay') {
      sheet(t('sh.notYet'), '<p class="sm">Mokėjimų dar nėra — MKK yra prototipas, ne parduotuvė.</p>' +
        '<p class="sm">MKK+ kainuos <b>' + esc(C.config.plans.plus.priceA) + '</b>; yra ir ' + esc(C.config.plans.plus.priceB) + ' variantas.</p>' +
        '<div class="coi">' + esc(LX(C.config.plans.gift, 'coi')) + '</div>' +
        '<p class="sm">Turi nuomonę apie kainą? Parašyk: krisvas.lt</p>', 'hero');
      return;
    }
    if (a === 'code') {
      var v = ($('#code') ? $('#code').value : '').trim().toUpperCase();
      if (/^(EXO|BUR)/.test(v) && v.length >= 4) {
        S.plus = true; S.code = v; save(); route(); toast(C.config.plans.gift.ok);
      } else { toast(C.config.plans.gift.bad); }
      return;
    }
    if (a === 'unplus') { S.plus = false; S.code = ''; save(); route(); toast('MKK+ išjungtas'); return; }
    if (a === 'reset') {
      sheet('Ištrinti viską?', '<p class="sm">Dings visi profiliai, serijos, spalvos ir kodas. Atgal nebus.</p>' +
        '<button class="btn" data-act="reset2" type="button">Taip, ištrinti</button>', 'hero');
      return;
    }
    if (a === 'reset2') {
      try { localStorage.removeItem(KEY); localStorage.removeItem(OLDKEY); } catch (er) {}
      OB = { step: 1, band: null, name: '', time: '' };
      loadState(); applyTheme(); closeSheet(); location.hash = '#/siandien'; route(); toast('Ištrinta'); return;
    }
  }

  /* ---------- offline ---------- */
  function paintNet() { $('#offline').hidden = navigator.onLine !== false; }

  /* ---------- boot ---------- */
  function start() {
    loadState();
    applyLang();
    applyTheme();
    var tb = document.getElementById('themeBtn');
    if (tb) tb.addEventListener('click', toggleTheme);
    if (window.matchMedia) {
      try { window.matchMedia('(prefers-color-scheme:dark)').addEventListener('change', paintThemeBtn); } catch (e) {}
    }
    document.addEventListener('click', onClick);
    $('#sheetClose').addEventListener('click', closeSheet);
    $('#scrim').addEventListener('click', closeSheet);
    $('#profileBtn').addEventListener('click', profileSheet);
    $('#streakBtn').addEventListener('click', function () {
      sheet('🔥 Serija', '<p class="big">' + (P ? P.streak : 0) + '</p><p class="sm">Dienų iš eilės, kai užbaigei tris žingsnius. Skaitymo minutė neskaičiuojama — ji nebūtina.</p>' +
        '<p class="sm muted">Nepertraukiamas dalyvavimas siejasi su 70 % mažesne tikimybe mesti. Pertrauktas dalyvavimas atrodo taip pat kaip nedalyvavimas. ' + evBadge('B') + ' <span class="meta">ŠALTINIS · Thouin 2020</span></p>' +
        '<p class="meta">Serija skaičiuojama tik šitame telefone.</p>', 'hero');
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });
    window.addEventListener('hashchange', route);
    window.addEventListener('online', paintNet);
    window.addEventListener('offline', paintNet);
    paintNet();
    if (S.ambient && S.ambient !== 'off') {
      document.addEventListener('click', function once() {
        ambientStart(S.ambient);
        document.removeEventListener('click', once);
      }, { once: true });
    }
    neurons();
    route();
  }

  function boot() {
    if (window.MKK_CONTENT) {
      C = window.MKK_CONTENT;
      I18 = C.i18n || I18;
      start(); return;
    }
    var names = ['config', 'techniques', 'practices', 'library', 'games', 'podcasts', 'illustrations',
      'i18n', 'about', 'blog', 'people', 'sources-lt'];
    Promise.all(names.map(function (n) {
      return fetch('./content/' + n + '.json')
        .then(function (r) { return r.ok ? r.json() : null; })
        .catch(function () { return null; });
    })).then(function (a) {
      C = {
        config: a[0], techniques: a[1], practices: a[2], library: a[3],
        games: a[4], podcasts: a[5], illustrations: a[6] || {},
        i18n: a[7] || null, about: a[8] || null, blog: a[9] || null,
        people: a[10] || null, sourcesLt: a[11] || null
      };
      I18 = C.i18n || I18;
      if (!C.config || !C.techniques || !C.practices || !C.library || !C.games) {
        document.getElementById('view').innerHTML =
          '<div class="card"><p class="lbl">' + esc(t('err.title')) + '</p><p class="sm">' + esc(t('err.load')) + '</p></div>';
        return;
      }
      start();
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
