<title>MKK</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* MKK v0.2.0 — ☀️ LIGHT default, 🌙 dark optional.
   Brand DNA: JetBrains Mono (UI + numbers) + Inter (human sentences), 4px, ONE red accent.
   Endel logic: one calm card, one action. Low stimulation: fades ≤200ms, no bounce, no confetti. */

:root{
  --ground:#FFFFFF;
  --surface:#F7F7F5;
  --card:#FFFFFF;
  --ink:#0A0A0A;
  --muted:#595959;
  --line:#E5E2DE;
  --accent:#D90429;
  --accent-ink:#FFFFFF;
  --red:#FF0000;
  --ok:#0B7A45;
  --tone:#5B6B8C;              /* per-topic muted tone — overridden per screen */
  --shadow:0 1px 0 rgba(10,10,10,.04), 0 8px 24px rgba(10,10,10,.05);
  --net:10,10,10;
  --netop:.05;
  --skel:#EDEBE8;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --body:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --r:4px;
  --tabh:64px;
  --pad:24px;                  /* ≥24px breathing room */
  --t:.18s;                    /* motion budget — never above .2s */
}

@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#080808; --surface:#111111; --card:#0D0D0D;
    --ink:#FAFAFA; --muted:#A3A3A3; --line:#262626;
    --accent-ink:#FFFFFF; --skel:#1A1A1A;
    --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
    --net:255,255,255; --netop:.07;
  }
}
:root[data-theme="dark"]{
  --ground:#080808; --surface:#111111; --card:#0D0D0D;
  --ink:#FAFAFA; --muted:#A3A3A3; --line:#262626;
  --accent-ink:#FFFFFF; --skel:#1A1A1A;
  --shadow:0 1px 0 rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.5);
  --net:255,255,255; --netop:.07;
}
:root[data-contrast="1"]{ --muted:#1A1A1A; --line:#0A0A0A; }
:root[data-theme="dark"][data-contrast="1"]{ --muted:#EDEDED; --line:#EDEDED; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--body); font-size:17px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--tabh) + env(safe-area-inset-bottom));
  overflow-x:hidden;
}
body.grayscale{filter:grayscale(1)}
#net{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;opacity:var(--netop)}

h1,h2,h3{margin:0 0 .4em}
p{margin:0 0 .8em}
a{color:var(--accent)}
button{font:inherit;color:inherit}
img{max-width:100%}

.h-mono,.lbl,.tl,.ev,.btn,.chip,.streak,.brand,.price,.clock,.pill{font-family:var(--mono)}
.lbl{
  font-size:11px;text-transform:uppercase;letter-spacing:.14em;font-weight:700;
  color:var(--muted);margin:0 0 10px;display:block;
}

/* ---------- top bar (sticky, safe-area, profile chip) ---------- */
#hdr{
  position:sticky;top:0;z-index:5;
  display:flex;align-items:center;gap:10px;
  padding:calc(10px + env(safe-area-inset-top)) max(16px,env(safe-area-inset-left)) 10px max(16px,env(safe-area-inset-right));
  background:color-mix(in srgb,var(--ground) 90%,transparent);
  backdrop-filter:saturate(1.2) blur(10px);
  border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;letter-spacing:.14em;font-size:14px;text-transform:uppercase}
.brand .dot{width:8px;height:8px;background:var(--red);border-radius:50%;display:inline-block;flex:0 0 8px}
#profileBtn{
  display:flex;align-items:center;gap:7px;margin-left:auto;
  background:transparent;border:1px solid var(--line);border-radius:var(--r);
  padding:5px 9px;cursor:pointer;max-width:44vw;
}
#profileBtn .av{
  width:20px;height:20px;border-radius:50%;flex:0 0 20px;
  background:var(--tone);color:#fff;font-family:var(--mono);font-size:10px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
#profileBtn .pn{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.streak{
  background:transparent;border:1px solid var(--line);border-radius:var(--r);
  padding:5px 10px;font-size:13px;font-weight:700;cursor:pointer;letter-spacing:.06em;flex:0 0 auto;
}
#offline{
  position:relative;z-index:4;
  background:var(--surface);border-bottom:1px solid var(--line);color:var(--muted);
  font-size:13.5px;line-height:1.45;text-align:center;padding:10px 16px;
}

/* ---------- layout ---------- */
#view{
  position:relative;z-index:1;max-width:560px;margin:0 auto;
  padding:24px max(18px,env(safe-area-inset-left)) 34px max(18px,env(safe-area-inset-right));
}
.scr{animation:fade var(--t) ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  .scr{animation:none}
  *,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:var(--pad);margin:0 0 16px;box-shadow:var(--shadow);
}
.card.flat{box-shadow:none;background:var(--surface)}
.big{font-size:30px;line-height:1.2;font-weight:600;letter-spacing:-.01em;margin:0 0 8px}
.big.sm2{font-size:22px}
.h2{
  font-family:var(--mono);font-size:12px;text-transform:uppercase;letter-spacing:.14em;
  font-weight:800;margin:32px 0 14px;color:var(--ink);
  border-left:3px solid var(--tone);padding-left:10px;
}
.muted{color:var(--muted)}
.sm{font-size:14.5px}
.xs{font-size:13.5px;line-height:1.55}
.center{text-align:center}
.spacer{height:20px}
hr.sep{border:0;border-top:1px solid var(--line);margin:20px 0}

/* ---------- illustrations ---------- */
/* The artwork is anime line-art on white with a lot of air: `contain` on a white plate,
   never `cover` — cropping to a band cuts the subject out of the frame entirely. */
.ill{
  display:block;width:100%;height:auto;aspect-ratio:3/2;object-fit:contain;
  border-radius:var(--r);background:#FFFFFF;border:1px solid var(--line);
}
.ill.sq{aspect-ratio:1/1}
.illwrap{margin:0 0 18px;position:relative;line-height:0}
.illwrap svg{display:block;width:100%;height:auto;background:transparent;border-radius:var(--r);border:1px solid var(--line)}
svg.ill,svg.ill-mini{background:transparent}
/* 44px is too small for `contain` — the subject shrinks to nothing. Minis crop instead. */
.ill-mini{
  display:block;width:44px;height:44px;border-radius:var(--r);
  object-fit:cover;object-position:center 58%;
  background:#FFFFFF;border:1px solid var(--line);
}
/* Dark theme: a full-white art plate is a bright slab — the opposite of "low stimulation".
   Dimming to .62 lands it as a calm mid-grey panel with the artwork EXACTLY as drawn
   (black hair stays black, the red accent stays red, skin tones untouched).
   The alternative — `filter:invert(1) hue-rotate(180deg)` — reads beautifully on black but
   recolours the children in the illustrations, so it is Kris's call, not a silent default. */
:root[data-theme="dark"] img.ill,:root[data-theme="dark"] img.ill-mini{opacity:.62}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) img.ill,:root:not([data-theme="light"]) img.ill-mini{opacity:.62}
}

/* ---------- the day card (Endel: one card, one action) ---------- */
.mode{
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  box-shadow:var(--shadow);overflow:hidden;margin:0 0 18px;
}
.mode .illwrap{margin:0}
.mode .illwrap .ill,.mode .illwrap svg{border:0;border-radius:0}
.mode .body{padding:var(--pad);border-top:3px solid var(--tone)}
.mode .lbl{color:var(--muted)}
.mode .big{font-size:29px;margin:0 0 10px}
.mode .why{font-size:15.5px;color:var(--muted);margin:0 0 20px}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--accent);color:var(--accent-ink);border:1px solid var(--accent);
  border-radius:var(--r);padding:16px 18px;font-size:14px;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;cursor:pointer;width:100%;
  text-decoration:none;min-height:54px;transition:opacity var(--t) ease-out;
}
.btn:active{opacity:.82}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{min-height:46px;padding:12px 14px;font-size:12.5px;width:auto}
.btn[disabled]{opacity:.45;cursor:default}
.btn+.btn{margin-top:10px}
.btnrow{display:flex;gap:10px}
.btnrow .btn+.btn{margin-top:0}

/* ---------- evidence badge (tone ring) ---------- */
.ev{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:28px;height:24px;padding:0 7px;border-radius:var(--r);
  font-size:11px;font-weight:800;letter-spacing:.08em;cursor:pointer;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);
  vertical-align:middle;box-shadow:0 0 0 1px var(--tone) inset;
}
.ev[data-ev="A"]{border-color:var(--ok);color:var(--ok)}
.ev[data-ev="B"]{border-color:var(--muted);color:var(--muted)}
.ev[data-ev="C"]{border-color:var(--line);color:var(--muted)}
.ev[data-ev="X"]{border-color:var(--accent);color:var(--accent)}

/* ---------- steps ---------- */
.step{
  display:flex;gap:14px;align-items:flex-start;
  border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:10px;
  background:var(--card);cursor:pointer;width:100%;text-align:left;
  transition:border-color var(--t) ease-out;
}
.step .n{
  flex:0 0 28px;height:28px;border-radius:50%;border:1px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-family:var(--mono);
  font-size:12px;font-weight:800;
}
.step.done{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 7%,var(--card))}
.step.done .n{background:var(--ok);border-color:var(--ok);color:#fff}
.step.opt{border-style:dashed}
.step .t{display:block;font-weight:600;line-height:1.35}
.step .s{display:block;font-size:13.5px;color:var(--muted);margin-top:3px;line-height:1.45}

/* ---------- lists ---------- */
.item{border-bottom:1px solid var(--line);padding:18px 0}
.item:last-child{border-bottom:0}
.item h3{font-size:18px;font-weight:600;margin:0 0 6px;display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.item .how{color:var(--ink);font-size:15.5px;margin:0 0 10px}
.item .prac{background:var(--surface);border-left:3px solid var(--tone);padding:12px 14px;border-radius:0 var(--r) var(--r) 0;font-size:15px}
.item .meta{font-size:12.5px;color:var(--muted);margin-top:10px;font-family:var(--mono);letter-spacing:.03em;line-height:1.5}
.item .src{font-size:12.5px;color:var(--muted);margin-top:8px;font-family:var(--mono);letter-spacing:.02em;line-height:1.5}
.item .src b{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:10.5px}

.chip{
  display:inline-block;border:1px solid var(--line);background:var(--card);
  border-radius:var(--r);padding:11px 13px;font-size:12px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;text-decoration:none;color:var(--ink);
  transition:background var(--t) ease-out;
}
.chip[aria-pressed="true"],.chip.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}

.catrow{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:14px;margin-bottom:10px;cursor:pointer;text-decoration:none;color:var(--ink);
  border-left:3px solid var(--tone);
  transition:background var(--t) ease-out;
}
.catrow .ic{flex:0 0 44px;width:44px;height:44px;line-height:0;display:block}
.catrow .tx{min-width:0}
.catrow .tx b{display:block;font-weight:600;font-size:17px}
.catrow .tx span{font-size:13.5px;color:var(--muted);display:block;line-height:1.45}
.catrow .ar{margin-left:auto;color:var(--muted);font-family:var(--mono);flex:0 0 auto;font-size:13px}

/* ---------- tabs ---------- */
#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:6;
  display:grid;grid-template-columns:repeat(5,1fr);
  background:color-mix(in srgb,var(--ground) 94%,transparent);
  backdrop-filter:saturate(1.2) blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.tab{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
  height:var(--tabh);text-decoration:none;color:var(--muted);
}
.tab .ti{font-size:19px;line-height:1}
.tab .tl{font-size:9.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.tab[aria-current="page"]{color:var(--accent)}

/* ---------- sheet ---------- */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.42);z-index:20;animation:fade var(--t) ease-out}
.sheet{
  position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88vh;overflow-y:auto;
  background:var(--ground);border-top:1px solid var(--line);
  border-radius:12px 12px 0 0;
  padding:26px max(20px,env(safe-area-inset-left)) calc(30px + env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-right));
  max-width:560px;margin:0 auto;animation:slideup var(--t) ease-out;
  -webkit-overflow-scrolling:touch;
}
@keyframes slideup{from{transform:translateY(14px);opacity:.6}to{transform:none;opacity:1}}
.sheet h2{font-size:13px;text-transform:uppercase;letter-spacing:.14em;font-weight:800;padding-right:34px}
.sheet-x{position:absolute;top:16px;right:16px;background:transparent;border:0;font-size:18px;cursor:pointer;color:var(--muted);padding:6px 10px}

#toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 18px);
  background:var(--ink);color:var(--ground);padding:12px 16px;border-radius:var(--r);
  font-size:14.5px;z-index:30;opacity:0;pointer-events:none;transition:opacity var(--t);
  max-width:88vw;text-align:center;line-height:1.45;
}
#toast.on{opacity:1}

/* ---------- forms ---------- */
input[type=text]{
  width:100%;padding:15px;font-size:16px;font-family:var(--mono);
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink);
}
input[type=text]:focus{outline:2px solid var(--accent);outline-offset:1px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:42px;height:42px;border-radius:var(--r);border:2px solid var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--ground) inset}

/* ---------- games ---------- */
.grid5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:16px 0}
.cell{
  aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:var(--r);background:var(--card);
  font-size:24px;cursor:pointer;padding:4px;text-align:center;word-break:break-word;
  transition:border-color var(--t) ease-out;
}
.cell[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--card));border-width:2px}
.cell.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--card))}
.cell.wrong{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card));opacity:.6}
.clock{font-size:58px;font-weight:800;text-align:center;letter-spacing:-.02em;margin:18px 0 8px;font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:20px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width var(--t) linear}
.check{
  display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-bottom:1px solid var(--line);
  cursor:pointer;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0;
}
.check .bx{flex:0 0 22px;height:22px;border:1px solid var(--line);border-radius:var(--r);display:flex;align-items:center;justify-content:center;font-size:12px}
.check.on .bx{background:var(--ok);border-color:var(--ok);color:#fff}

/* ---------- week dots + history ---------- */
.week{display:flex;gap:9px;justify-content:space-between;margin:6px 0 4px}
.wd{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px}
.wd .d{
  width:100%;max-width:30px;aspect-ratio:1/1;border-radius:50%;
  border:1.5px solid var(--line);background:transparent;
}
.wd.on .d{background:var(--tone);border-color:var(--tone)}
.wd.today .d{box-shadow:0 0 0 2px var(--ground),0 0 0 3.5px var(--tone)}
.wd .n{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.stats{display:flex;gap:10px;margin-top:18px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;text-align:center}
.stat .v{font-family:var(--mono);font-size:26px;font-weight:800;line-height:1.1}
.stat .k{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin-top:5px}
.hrow{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.hrow:last-child{border-bottom:0}
.hrow .hd{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;flex:0 0 84px;color:var(--muted)}
.hrow .hm{font-size:15px}

/* ---------- skeleton ---------- */
.sk{background:var(--skel);border-radius:var(--r);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.sk.l{height:14px;margin-bottom:12px}
.sk.w40{width:40%}.sk.w70{width:70%}.sk.w90{width:90%}
.sk.img{aspect-ratio:3/2;height:auto;margin-bottom:18px}
.sk.btn{height:54px;margin-top:20px}

/* ---------- empty state ---------- */
.empty{text-align:center;padding:14px 0 6px}
.empty .illwrap{max-width:220px;margin:0 auto 18px;opacity:.85}
.empty p{color:var(--muted);font-size:15px}

/* ---------- onboarding ---------- */
.dots{display:flex;gap:7px;justify-content:center;margin:0 0 26px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--tone);width:22px;border-radius:4px}
.ob .catrow{padding:12px}

/* ---------- notes / disclosure (13.5px min — dyslexia-first) ---------- */
.note{font-size:13.5px;color:var(--muted);border-left:3px solid var(--line);padding-left:13px;margin:14px 0;line-height:1.6}
.warn{border-left-color:var(--accent)}
.foot{font-size:13.5px;color:var(--muted);line-height:1.65;margin-top:30px;padding-top:20px;border-top:1px solid var(--line)}
.coi{font-size:13.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:14px 0;line-height:1.6}
.coi.tight{margin:0 0 4px;padding:13px}
.price{font-size:26px;font-weight:800;letter-spacing:-.01em;margin:0 0 2px}
.price2{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--muted);margin:0 0 12px}
.pill{
  display:inline-block;background:var(--ok);color:#fff;border-radius:var(--r);
  padding:5px 9px;font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px;
}
ul.plain{margin:0;padding-left:18px}
ul.plain li{margin-bottom:7px;font-size:15px}
audio{width:100%;margin-top:12px}
.audio-wrap{margin-top:12px}

/* ---------- v0.3 · theme flip in the top bar + LT source line ---------- */
#hdr .themebtn{
  margin-left:8px;display:inline-flex;align-items:center;justify-content:center;
  width:40px;height:40px;min-width:40px;border-radius:4px;
  border:1px solid var(--line);background:var(--card);color:var(--ink);
  font-size:17px;line-height:1;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
#hdr .themebtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:360px){#hdr .themebtn{width:36px;height:36px;min-width:36px;font-size:15px}}
.src.lt{margin-top:4px;opacity:.9}
.src.lt a{color:inherit}
#profileBtn[hidden] ~ #streakBtn{margin-left:auto}
</style>
<canvas id="net" aria-hidden="true"></canvas>

<header id="hdr">
  <div class="brand"><span class="dot"></span><span id="brandName">MKK</span></div>
  <button id="profileBtn" type="button" hidden aria-label="Profilis — perjungti">

h does not back it. Free for everyone."}],"techniques":[{"id":"wm4","cat":"smegenys","name":"Keturios vietos galvoje","how":"Vienu metu galvoje telpa apie keturi nauji dalykai — vaikams mažiau.","practice":"Pasakyk vaikui 4 daiktus, paprašyk atkartoti. Tada 6. Parodyk, kur lūžta — ir kad tai normalu.","age":5,"ev":"A","src":"Cowan 2010","name_en":"Four slots in the head","how_en":"About four new things fit in the head at once — fewer for children."},{"id":"ltm","cat":"smegenys","name":"Ilgalaikė atmintis neturi ribos","how":"Vietos galvoje netrūksta. Trūksta kelio iš darbinės atminties į ilgalaikę.","practice":"Paklausk vaiko, ką jis prisimena iš praėjusios savaitės pamokos. Ne perskaityk — prisimink.","age":6,"ev":"A","src":"Sweller 2019"},{"id":"chunk","cat":"smegenys","name":"Gabaliukai auga","how":"Kai įgūdis tampa savaimingas, jis užima vieną vietą vietoj keturių.","practice":"Išrink vieną dalyką, kurį vaikas daro lėtai ir sąmoningai. Pakartokite jį 2 min, kol tampa automatiškas.","age":7,"ev":"A","src":"Sweller 2019"},{"id":"split","cat":"smegenys","name":"Užrašas ant paveikslėlio","how":"Kai paaiškinimas ore, o paveikslėlis ekrane, vaikas eikvoja jėgas jų sujungimui.","practice":"Paimk bet kurią vaiko užduotį ir užrašyk žodžius TIESIOG ant piešinio, ne šalia jo.","age":6,"ev":"B","src":"CESE NSW 2017"},{"id":"forget","cat":"smegenys","name":"Pamiršti — ne gedimas","how":"Prisiminti sunku todėl, kad atmintis šiek tiek išbluko. Tos pastangos ir yra mokymasis.","practice":"Neatsakyk už vaiką. Palauk 10 sekundžių tylos. Tos 10 sekundžių dirba.","age":6,"ev":"B","src":"Nature Rev Psychology 2022"},{"id":"emotion","cat":"smegenys","name":"Emocija atrenka","how":"Vaikas, pasijutęs kvailas trečią minutę, nieko neišmoksta nuo ketvirtos iki devyniasdešimtos.","practice":"Pradėk nuo užduoties, kurią vaikas tikrai įveiks. Sėkmė pirma, sunkumas antras.","age":4,"ev":"B","src":"Mokymosi mokslo kursas L2.6"},{"id":"sleep","cat":"smegenys","name":"Miegas sutvirtina","how":"7–12 m. vaikai per naktį išlaiko tai, ką suaugusieji pamiršta.","practice":"Kartok naują dalyką vakare, prieš miegą — 2 min, be ekrano. Ryte paklausk, kas liko.","age":7,"ev":"A","src":"Peiffer ir kt. 2020, Scientific Reports · Kurz ir kt. 2025, J. Sleep Research · AASM 2016 konsensusas (JCSM)"},{"id":"retrieval","cat":"top3","name":"Prisiminimas be žiūrėjimo","how":"Vaikas pats pasako atsakymą, neatsivertęs knygos. Stipriausia technika, kokią turim.","practice":"Uždaryk knygą. 2 minutes vaikas pasakoja, ką prisimena. Tik po to tikrinam.","age":5,"ev":"A","src":"Dunlosky 2013 · Franzoi 2025 (67 % vs 48,6 %)","name_en":"Recall instead of re-reading","how_en":"Close the book and say what you remember — that is what makes it stick."},{"id":"spacing","cat":"top3","name":"Kartok kitą dieną","how":"Išskirstytas kartojimas veikia laboratorijoje. ⚠️ 2025 m. klasėje intervalo keitimas nieko nedavė.","practice":"Tą patį klausimą užduok rytoj, ne po penkių minučių. Vieną klausimą. Vieną kartą.","age":6,"ev":"B","src":"Dunlosky 2013 · Franzoi 2025","name_en":"Spread it out","how_en":"The same 30 minutes split across three days beats 30 minutes in one sitting."},{"id":"success","cat":"top3","name":"70–90 % teisingai","how":"Klausimai turi būti tokie, kad vaikas dažniau atsakytų teisingai nei ne. Žemiau to — tai jau ne treniruotė, o nesėkmė.","practice":"Suskaičiuok 10 klausimų atsakymus. Jei teisingų mažiau nei 7 — klausimai per sunkūs, ne vaikas per silpnas.","age":5,"ev":"A","src":"Káldi ir kt. 2025 (n=202)","name_en":"Aim for 70–90 % right","how_en":"Training works when it is a bit hard, not when everything is correct."},{"id":"recall-say","cat":"atmintis","name":"Pasakyk atmintinai","how":"Laisvas prisiminimas balsu — pigiausias ir stipriausias įrankis.","practice":"„Papasakok viską, ką prisimeni.“ 2 min. Be pertraukimų. Tada kartu patikrinam, ko trūko.","age":5,"ev":"A","src":"Dunlosky 2013"},{"id":"cards","cat":"atmintis","name":"Trijų klausimų kortelė","how":"Trys klausimai vietoj perskaitytos pastraipos.","practice":"Užrašyk 3 klausimus iš to, ką vaikas mokėsi. Rytoj paklausk jų.","age":7,"ev":"A","src":"Dunlosky 2013"},{"id":"dual","cat":"atmintis","name":"Žodis ir paveikslėlis","how":"Ne todėl, kad vaikas „vizualas“ — o todėl, kad taip veikia atmintis pas visus.","practice":"Paprašyk vaiko nupiešti tai, ką ką tik pasakė. Vienas piešinys, 2 min.","age":4,"ev":"B","src":"Learning Scientists · Deans for Impact"},{"id":"draw","cat":"atmintis","name":"Piešk, o ne skaityk antrą kartą","how":"Piešimas priverčia pagaminti prasmę. Pakartotinis skaitymas — ne.","practice":"Uždaryk knygą. Nupiešk, kas ten vyko. Paskui palygink su knyga.","age":5,"ev":"B","src":"Generative learning REV"},{"id":"teach","cat":"atmintis","name":"Paaiškink kitam","how":"Mokyti ką nors — tai mokymosi būdas, ne egzaminas.","practice":"60 sekundžių vaikas aiškina tau (ar pliušiniam meškiukui) vieną dalyką. Tu klausi „kodėl?“.","age":6,"ev":"B","src":"Generative learning REV"},{"id":"elab","cat":"atmintis","name":"Klausimas „kodėl taip?“","how":"Elaboracija — vaikas pats susieja naują dalyką su tuo, ką jau žino.","practice":"Po kiekvieno fakto klausk „kodėl taip?“ tris kartus iš eilės. Sustok, kai vaikas sako „nežinau“ — ten prasideda mokymasis.","age":8,"ev":"B","src":"Dunlosky 2013 (elaboratyvus klausinėjimas — VIDUTINĖ nauda)"},{"id":"interleave","cat":"atmintis","name":"Maišyk uždavinių tipus","how":"Interleaving veikia — bet geriausiai įrodytas matematikoje ir kategorijose. Ne visur.","practice":"Vietoj 10 vienodų uždavinių duok 6 skirtingų tipų, sumaišytus.","age":8,"ev":"B","src":"Dunlosky 2013"},{"id":"mnemo","cat":"atmintis","name":"Istorija iš daiktų","how":"⚠️ Sąžiningai: Dunlosky raktažodžių mnemoniką vertina kaip MAŽOS naudos bendram mokymuisi. Smagu, bet nėra pagrindinis įrankis.","practice":"Susiek 5 daiktus į vieną juokingą istoriją. Po valandos paklausk sąrašo.","age":7,"ev":"C","src":"Dunlosky 2013 (LOW utility)"},{"id":"one-instr","cat":"demesys","name":"Vienas nurodymas vienu metu","how":"Trys nurodymai iš karto — vienas iškris. Ir tai ne vaiko kaltė.","practice":"Duok vieną nurodymą, palauk, kol bus padarytas, tada kitą. 2 min pabandyk taip.","age":4,"ev":"B","src":"Cowan 2010 · CLT"},{"id":"one-new","cat":"demesys","name":"Vienas naujas dalykas","how":"6–8 m.: vienas naujas dalykas + vienas naujas įrankis per kartą. 9–12 m.: du + vienas.","practice":"Suskaičiuok, kiek naujų dalykų buvo šiandienos pamokoje. Jei daugiau nei du — žinai, kodėl nepavyko.","age":6,"ev":"A","src":"Sweller 2019 · CESE NSW"},{"id":"phone-away","cat":"demesys","name":"Telefonas kitame kambaryje","how":"Telefonas kitame kambaryje, ne ekranu žemyn ant stalo. ⚠️ Tirta su suaugusiais; 2023 m. meta-analizė efektą rado mažesnį ir nepastovesnį nei originalas.","practice":"Padėk telefoną kitame kambaryje. Ne ant stalo ekranu žemyn — kitame kambaryje. 10 min.","age":8,"ev":"B","src":"Ward ir kt. 2017 (n≈800, suaugę) · 2023 meta-analizė (ginčija dydį)"},{"id":"grayscale","cat":"demesys","name":"Pilkas ekranas","how":"Pilkas ekranas nuima pusę to, kas telefone traukia. ⚠️ Vienas tyrimas: ~38 min/d mažiau ekrano; 2024 m. pakartojimas — silpnesnis. Su vaikais netirta.","practice":"Įjunk pilką ekraną telefone vienam vakarui. Paklausk vaiko, ar pastebėjo skirtumą.","age":9,"ev":"C","src":"Holte & Ferraro 2020, The Social Science Journal (n=161) · ⚠️ Dekker & Baumgartner 2024 — silpnesnis"},{"id":"move","cat":"demesys","name":"Judesys prieš mokymąsi","how":"9 mėn. popamokinė judėjimo programa pagerino vykdomąją kontrolę 7–9 m. vaikams.","practice":"5 min judesio prieš namų darbus: šuoliukai, laiptai, šokis. Ne „nusiraminti“ — pasiruošti.","age":6,"ev":"B","src":"Hillman ir kt. 2014 FITKids RCT (n=221, 7–9 m.)"},{"id":"stop-switch","cat":"demesys","name":"Stop ir keisk","how":"Taisyklė pasikeičia žaidimo viduryje. ⚠️ Bet: bendri „smegenų treniruokliai“ neperkelia įgūdžio — tai veikia tik įdomios veiklos viduje.","practice":"Žaidimas: plok, kai sakau „žalia“. Po minutės apversk taisyklę. Dar po minutės — vėl.","age":5,"ev":"B","src":"Diamond 2013 · Nature Neuroscience 2024 (neigiamas)"},{"id":"nothing-held","cat":"demesys","name":"Nieko nelaikyti galvoje per perėjimą","how":"4–7 m. vaikas neišneša nurodymo iš vieno kambario į kitą. Daiktas turi būti rankoje.","practice":"Duok nurodymą ten, kur jis bus vykdomas, su daiktu rankose. Ne iš virtuvės į vaikų kambarį.","age":4,"ev":"B","src":"Cowan 2010"},{"id":"two-min","cat":"fokusas","name":"Dvi minutės — pradžios slenkstis","how":"⚠️ Praktika, ne tyrimas. Bet pradėti visada sunkiau nei tęsti.","practice":"Susitark: tik 2 minutės. Įjunk laikmatį. Po 2 min galima teisėtai sustoti — dažniausiai nesustoja.","age":7,"ev":"C","src":"MKK praktika"},{"id":"single-task","cat":"fokusas","name":"Vienas darbas ir laikmatis","how":"Matomas laikas paverčia „amžinai“ į „penkias minutes“.","practice":"Vienas darbas. Laikmatis matomas. Kol skaičiuoja — nieko kito.","age":8,"ev":"C","src":"MKK praktika"},{"id":"plan-first","cat":"fokusas","name":"Planas prieš darbą","how":"Planas → darbas → peržiūra. Dauguma daro tik vidurinę dalį.","practice":"Prieš pradedant: 3 žingsniai ant popieriaus. Po darbo — pažymėk, kurie pavyko.","age":8,"ev":"B","src":"SRL META (~0,69; mažiau, kai veda mokytojas)"},{"id":"review-q","cat":"fokusas","name":"„Kas buvo sunkiausia?“","how":"Vienas stipriausių efektų literatūroje. ⚠️ Su sąlyga: tyrimuose tai darė mokslininkai, ne mokytojai — pas mokytojus efektas mažesnis.","practice":"Po darbo — vienas klausimas: kas buvo sunkiausia? Ir antras: ką darysi kitaip?","age":8,"ev":"B","src":"Metakognicijos META"},{"id":"easy-hard","cat":"fokusas","name":"Dvi ikonos: lengva / sunku","how":"Iki ~8 m. vaikai save vertina per gerai. Refleksija turi būti konkreti, ne atvira.","practice":"Dvi kortelės: 😀 lengva, 😵 sunku. Vaikas padeda užduotį ant vienos. Viskas.","age":5,"ev":"B","src":"Metakognicijos REV"},{"id":"goal-mine","cat":"fokusas","name":"Tikslą renkuosi aš, žingsnius — tu","how":"Vadovaujamas žaidimas įveikė ir tiesioginį mokymą, ir laisvą žaidimą. Nuimk vieną pusę — efektas dingsta.","practice":"Pasakyk tikslą ir vieną apribojimą. Būdą tegu renkasi vaikas. Tu klausi klausimų, nerodai.","age":4,"ev":"A","src":"Skene ir kt. 2022 META (17 tyrimų, N=3 893)"},{"id":"first-three","cat":"koncentracija","name":"Pirmos trys minutės — ne turiniui","how":"Pirma reikia, kad pavyktų. Tik tada galima sunkiau.","practice":"Pradėk nuo to, ką vaikas jau moka. Trys minutės sėkmės. Tada nauja.","age":4,"ev":"B","src":"Mokymosi mokslo kursas L2.6"},{"id":"break-move","cat":"koncentracija","name":"Pertrauka su judesiu","how":"Judesys nėra pertrauka nuo mokymosi. FITKids tyrime judesys BUVO intervencija.","practice":"Kas 15 min — 60 sekundžių judesio. Ne telefonas. Kūnas.","age":6,"ev":"B","src":"Hillman ir kt. 2014 FITKids RCT (n=221, 7–9 m.)"},{"id":"sleep-window","cat":"koncentracija","name":"Miego langas","how":"Tai, kas išmokta 17 val., sutvirtinama 22 val. ⚠️ Mechanizmo išvada, ne tyrimas apie būrelius.","practice":"Paskutinis kartojimas 30 min prieš miegą, be ekrano. Ryte — vienas klausimas.","age":6,"ev":"C","src":"Peiffer ir kt. 2020, Scientific Reports · Kurz ir kt. 2025, J. Sleep Research (mechanizmo išvada)"},{"id":"clean-desk","cat":"koncentracija","name":"Vieno daikto stalas","how":"⚠️ Praktika. Bet kiekvienas daiktas ant stalo yra pasiūlymas nustoti.","practice":"Nuo stalo nuimk viską, išskyrus tai, ko reikia dabar. 30 sekundžių darbo.","age":6,"ev":"C","src":"MKK praktika"},{"id":"noise","cat":"koncentracija","name":"Fono garsas","how":"⚠️ Jokių mokslinių pažadų. Kai kuriems padeda uždengti triukšmą — ir tiek.","practice":"Įjunk fono garsą programėlėje 5 min. Paklausk vaiko: geriau, blogiau ar vienodai?","age":8,"ev":"C","src":"MKK praktika"},{"id":"feedback-work","cat":"koncentracija","name":"Kalbėk apie darbą, ne apie vaiką","how":"Informatyvus grįžtamasis ryšys d=0,99. Pagyrimas ar bausmė d=0,24. Trečdalis atvejų net pablogina.","practice":"Vietoj „šaunuolis“ pasakyk, ką tiksliai vaikas padarė: „tu tris kartus bandei kitaip, kol suveikė“.","age":4,"ev":"A","src":"Grįžtamojo ryšio META 2020","name_en":"Feedback about the work, not the child","how_en":"\"This step is wrong\" teaches; \"you are careless\" does not."}],"myths":[{"id":"m-styles","name":"Mokymosi stiliai (vizualas · audialas · kinestetikas)","claim":"„Mano vaikas — vizualas, jam reikia mokyti paveikslėliais.“","truth":"Nė vienas tyrimas neatlaikė patikros. Pomėgiai tikri — bet mokymo pritaikymas jiems nepadeda. Daugiau nei 80 % mokytojų tuo tiki.","instead":"Duok visiems ir žodį, ir paveikslėlį, ir daiktą į rankas — ne dėl stiliaus, o todėl, kad taip veikia atmintis.","ev":"X","src":"Pashler ir kt. 2008 · Dekker ir kt. 2012"},{"id":"m-hemi","name":"Kairysis ir dešinysis pusrutulis","claim":"„Jis kūrybiškas, nes dešiniapusis.“","truth":"Mitas. Taip pat tikimas daugiau nei 80 % mokytojų.","instead":"Kalbėk apie tai, ką vaikas daro, o ne apie tai, kokia jo smegenų pusė.","ev":"X","src":"Dekker ir kt. 2012"},{"id":"m-10","name":"Naudojame tik 10 % smegenų","claim":"„Atrakink likusius 90 %.“","truth":"Mitas. Naudojame visas.","instead":"Nieko atrakinti nereikia. Reikia prisiminti, pakartoti ir pabandyti dar kartą.","ev":"X","src":"Neuromitų literatūra"},{"id":"m-brain-train","name":"Smegenų treniruokliai lavina dėmesį","claim":"„Ši programėlė lavina vaiko susikaupimą.“","truth":"2024 m. tyrimas su 235 vaikais (6–13 m.): 8 savaitės treniruočių pagerino TĄ žaidimą ir daugiau nieko — nei mokslus, nei smegenų struktūrą.","instead":"Dėmesys auga sunkioje, bet įdomioje veikloje: statyboje, muzikoje, sporte, projekte.","ev":"X","src":"Nature Neuroscience 2024 RCT (n=235)"},{"id":"m-chess","name":"Šachmatai ar muzika padaro protingesnį","claim":"„Muzika lavina matematinį mąstymą.“","truth":"Su aktyvia kontroline grupe efektas beveik dingsta: šachmatai g=0,34 → ~0; muzika g=0,18 → −0,02. ⚠️ Šis nulis pats yra ginčijamas — sakau „ginčijama“, ne „paneigta“.","instead":"Muzika verta dėl muzikos. Šachmatai — dėl šachmatų. To pakanka.","ev":"X","src":"Sala & Gobet 2016–2020 · Bigand & Tillmann 2021"},{"id":"m-reread","name":"Perskaityti dar kartą ir pasibraukti","claim":"„Pakartok — perskaityk dar kartą.“","truth":"Abu vertinami kaip MAŽOS naudos. Klasėje: testas su grįžtamuoju ryšiu 67 %, pakartotinis skaitymas 48,6 %.","instead":"Uždaryk knygą ir pabandyk pasakyti pats. Tik tada tikrink.","ev":"X","src":"Dunlosky 2013 · Franzoi ir kt. 2025"},{"id":"m-2sigma","name":"Meistriškumo mokymasis duoda „2 sigma“","claim":"„Šis metodas duoda dviejų standartinių nuokrypių šuolį.“","truth":"Ne. Tas skaičius buvo apie INDIVIDUALŲ korepetitorių 1984 m., ne apie metodą. Paties metodo efektas maždaug 0,5 SD.","instead":"Klausk, su kuo lyginama. Be palyginimo grupės nėra teiginio.","ev":"X","src":"Bloom 1984 · meistriškumo META"},{"id":"m-ai","name":"AI mokytojas įrodytai padeda vaikams","claim":"„Dirbtinis intelektas — asmeninis vaiko mokytojas.“","truth":"Vaikams 3–12 m. tokių tyrimų NĖRA. O neapribotas AI paaugliams pakenkė: kai jį atėmė, jie pasirodė 17 % prasčiau nei tie, kurie jo niekada neturėjo. Tas pats modelis, priverstas duoti tik užuominas, žalos nedarė.","instead":"AI niekada neturi pasakyti atsakymo, kurį vaikas pats buvo bepasakąs. Skirtumas ne technologijoje, o taisyklėse.","ev":"X","src":"2024–2025 RCT (9–11 kl.) · UNESCO"}]},"practices":{"practices":[{"id":"p-recall3","title":"Trys dalykai be žiūrėjimo","why":"Prisiminimas be knygos — stipriausia technika, kokią turim.","steps":["Uždaryk knygą arba sąsiuvinį.","Pasakyk garsiai 3 dalykus, kuriuos šiandien mokeisi.","Tik dabar pasitikrink, ko trūko."],"minAge":5,"ev":"A","src":"Dunlosky 2013 · Franzoi 2025"},{"id":"p-yesterday","title":"Vakarykštis klausimas","why":"Kartojimas kitą dieną, ne po penkių minučių.","steps":["Prisimink VIENĄ vakar dienos dalyką.","Pasakyk jį garsiai, nežiūrėdamas.","Jei nepavyko — tai gerai. Dabar pažiūrėk ir rytoj bandyk vėl."],"minAge":6,"ev":"B","src":"Franzoi 2025 (⚠️ klasėje intervalas nedavė skirtumo)"},{"id":"p-teach60","title":"60 sekundžių paaiškink","why":"Mokyti kitą — mokymosi būdas, ne egzaminas.","steps":["Pasirink vieną dalyką, kurį šiandien supratai.","60 sekundžių aiškink jį žmogui arba meškiukui.","Tegu jis paklausia „kodėl?“ vieną kartą."],"minAge":6,"ev":"B","src":"Generative learning REV"},{"id":"p-draw","title":"Piešinys iš atminties","why":"Piešimas priverčia pagaminti prasmę. Pakartotinis skaitymas — ne.","steps":["Uždenk tekstą.","Nupiešk tai, apie ką jis buvo. 90 sekundžių.","Palygink. Kas dingo?"],"minAge":5,"ev":"B","src":"Generative learning REV"},{"id":"p-why3","title":"Trys „kodėl?“","why":"Elaboracija — vaikas pats susieja naują dalyką su tuo, ką jau žino.","steps":["Pasakyk vieną faktą.","Klausk „kodėl taip?“ tris kartus iš eilės.","Kai atsakymas „nežinau“ — ten prasideda mokymasis."],"minAge":8,"ev":"B","src":"Dunlosky 2013 (vidutinė nauda)"},{"id":"p-move","title":"Du judesio","why":"9 mėn. judėjimo programa pagerino vykdomąją kontrolę 7–9 m. vaikams.","steps":["2 minutes: šuoliukai, laiptai arba šokis.","Tada iškart — sunkiausia dienos užduotis.","Ne „nusiraminti“, o pasiruošti."],"minAge":5,"ev":"B","src":"Hillman ir kt. 2014 FITKids RCT (n=221)"},{"id":"p-phone","title":"Telefonas kitame kambaryje","why":"Ne ekranu žemyn ant stalo — kitame kambaryje. ⚠️ Tirta su suaugusiais, dydis ginčijamas.","steps":["Nunešk telefoną į kitą kambarį.","10 minučių vienas darbas.","Grįžk ir pasakyk: buvo lengviau ar tas pats?"],"minAge":8,"ev":"B","src":"Ward ir kt. 2017 · 2023 meta-analizė"},{"id":"p-plan3","title":"Trys žingsniai popieriuje","why":"Planas → darbas → peržiūra. Dauguma daro tik vidurinę dalį.","steps":["Prieš pradėdamas užrašyk 3 žingsnius.","Dirbk.","Pažymėk, kurie pavyko."],"minAge":8,"ev":"B","src":"SRL META (~0,69; mažiau, kai veda mokytojas)"},{"id":"p-hardest","title":"Kas buvo sunkiausia?","why":"Vienas stipriausių efektų literatūroje — su sąlyga, kad klausiama tikrai.","steps":["Po darbo sustok minutei.","Atsakyk: kas buvo sunkiausia?","Ir: ką darysi kitaip rytoj?"],"minAge":8,"ev":"B","src":"Metakognicijos META"},{"id":"p-easyhard","title":"Lengva ar sunku?","why":"Iki ~8 m. vaikai save vertina per gerai. Refleksija turi būti konkreti.","steps":["Parodyk du ženklus: 😀 lengva, 😵 sunku.","Vaikas parodo, kaip buvo.","Jokių paaiškinimų nereikia."],"minAge":4,"ev":"B","src":"Metakognicijos REV"},{"id":"p-four","title":"Keturi daiktai","why":"Darbinė atmintis telpa apie keturis dalykus. Vaikams mažiau.","steps":["Pasakyk 4 daiktus. Vaikas atkartoja.","Tada 6. Dažniausiai nepavyks.","Pasakyk: tai ne tavo kaltė — tokia atmintis pas visus."],"minAge":4,"ev":"A","src":"Cowan 2010"},{"id":"p-picture","title":"Žodis ir paveikslėlis","why":"Ne todėl, kad vaikas „vizualas“ — o todėl, kad taip veikia atmintis pas visus.","steps":["Pasakyk vieną naują žodį.","Nupiešk jį mažu piešinuku šalia.","Rytoj parodyk tik piešinį."],"minAge":4,"ev":"B","src":"Learning Scientists"},{"id":"p-feedback","title":"Pagirk darbą, ne vaiką","why":"Informatyvus grįžtamasis ryšys d=0,99. Pagyrimas d=0,24. Trečdalis atvejų net pablogina.","steps":["Rask vieną dalyką, kurį vaikas padarė.","Pasakyk TIKSLIAI ką: „tu bandei tris kartus kitaip“.","Žodžio „šaunuolis“ šiandien nevartok."],"minAge":4,"ev":"A","src":"Grįžtamojo ryšio META 2020"},{"id":"p-goal","title":"Tikslas mano, žingsniai tavo","why":"Vadovaujamas žaidimas įveikė ir tiesioginį mokymą, ir laisvą žaidimą.","steps":["Pasakyk tikslą ir vieną apribojimą.","Būdą renkasi vaikas.","Tu tik klausi klausimų. Nerodai."],"minAge":4,"ev":"A","src":"Skene ir kt. 2022 META (N=3 893)"}],"checks":[{"id":"c-phone","text":"Telefonas buvo kitame kambaryje","minAge":8},{"id":"c-move","text":"Pajudėjau prieš sunkiausią užduotį","minAge":4},{"id":"c-say","text":"Pasakiau vieną dalyką iš atminties, nežiūrėdamas","minAge":5},{"id":"c-sleep","text":"Šiandien einu miegoti tuo pačiu laiku","minAge":4},{"id":"c-one","text":"Dariau vieną darbą vienu metu","minAge":6},{"id":"c-ask","text":"Paklausiau „kodėl taip?“ bent vieną kartą","minAge":6},{"id":"c-hard","text":"Pasakiau, kas buvo sunkiausia","minAge":5},{"id":"c-desk","text":"Ant stalo liko tik tai, ko reikia","minAge":5}]},"library":{"segments":[{"id":"knygos","icon":"📚","label":"Knygos","label_en":"Books"},{"id":"dokumentika","icon":"🎬","label":"Dokumentika","label_en":"Documentaries"},{"id":"podkastai","icon":"🎧","label":"Podcast'ai","label_en":"Podcasts"},{"id":"tyrimai","icon":"🔬","label":"Naujausi tyrimai","label_en":"Latest research"},{"id":"bureliai","icon":"🎪","label":"Būreliai","label_en":"After-school clubs"},{"id":"irankiai","icon":"🏠","label":"Namų įrankiai","label_en":"Home tools"}],"knygos":[{"title":"Learning How to Learn","author":"Barbara Oakley, Terrence Sejnowski","who":"Vaikams ir paaugliams 10+","why":"Parašyta dirbančių kognityvinių mokslininkų, tiesiai vaiko amžiaus grupei. Artimiausia tam, ką daro MKK.","lt":"⚠️ lietuviško vertimo neradau"},{"title":"Make It Stick","author":"Brown, Roediger, McDaniel","who":"Tėvams ir mokytojams","why":"Prisiminimo, išskirstymo ir maišymo sintezė. Jei skaitysi vieną knygą — šitą.","lt":"⚠️ lietuviško vertimo neradau"},{"title":"Sėkmės psichologija (Mindset)","author":"Carol Dweck","who":"Tėvams","why":"Augimo mąstysenos pradžia. ⚠️ Skaityk kartu su 2018–2023 m. ginču: efektas tikras, bet mažas ir sąlyginis (0,09–0,16 SD).","lt":"✅ yra lietuviškai"},{"title":"Kaip veikia smegenys","author":"Dr. Ramunė Dirvanskienė","who":"Tėvams","why":"Vienintelė lietuvių autorės knyga apie smegenis, kurią radau šiame etape. ⚠️ Nepatikrinau jos įrodymų kokybės — perskaityk pats prieš rekomenduodamas.","lt":"✅ lietuviška originali"},{"title":"The Gardener and the Carpenter","author":"Alison Gopnik","who":"Tėvams","why":"Atsvara „optimizuok savo vaiką“ mąstymui. Priminimas, kad vaikas nėra projektas.","lt":"⚠️ lietuviško vertimo neradau"}],"dokumentika":[{"title":"Screenagers","who":"Tėvams + 10–14 m.","why":"Ekranai, miegas, dėmesys. Tinka žiūrėti kartu ir po to kalbėtis.","note":""},{"title":"My Octopus Teacher","who":"Šeimai 6+","why":"Ne apie mokymosi mokslą — bet parodo smalsumą, iš kurio mokymasis prasideda.","note":""},{"title":"The Social Dilemma","who":"13+ ir tėvams","why":"Dėmesio ekonomika ir dizainas, kuris traukia.","note":"⚠️ Vietomis perdramatizuota. Palygink su radiniu, kad ekrano laikas paaiškina mažiau nei 1 % savijautos skirtumų."}],"podkastai":[{"title":"The Learning Scientists Podcast","who":"Tėvams ir mokytojams","why":"Tiesiai tos pačios šešios strategijos, kuriomis remiasi MKK."},{"title":"Cult of Pedagogy","who":"Mokytojams ir tėvams","why":"Atskiras ciklas apie mokymąsi ir atmintį."},{"title":"Hidden Brain (NPR)","who":"Suaugusiems","why":"Prieinamas kognityvinis mokslas. Gera medžiaga pokalbiui prie vakarienės."}],"tyrimai":[{"title":"Prisiminimo praktika realioje klasėje","year":"2025","finding":"5 klasė: testas su grįžtamuoju ryšiu 67,0 %, pakartotinis skaitymas 48,6 %. Intervalo keitimas (1 vs 4 dienos) nedavė nieko.","means":"Prisiminimas — stiprus. Išskirstymas klasėje silpnesnis, nei parduodama.","ev":"A","src":"Franzoi ir kt. 2025 — prisiminimas realioje 5 klasėje"},{"title":"Smegenų treniruokliai vaikams","year":"2024","finding":"235 vaikai (6–13 m.), 8 savaitės stabdymo treniruočių: pagerėjo tik treniruota užduotis. Nei mokslai, nei smegenų struktūra.","means":"„Programėlė lavina dėmesį“ — nesąžininga. Ir tai svarbiausias neigiamas radinys visoje MKK.","ev":"X","src":"Nature Neuroscience 2024 RCT (n=235, 6–13 m.)"},{"title":"Prisiminimas darželinukams","year":"2025","finding":"n=202, 5–6 m.: prisiminimo praktika veikia — bet tik virš pakankamo sėkmės lygio treniruotės metu.","means":"Per sunkūs klausimai paverčia treniruotę nesėkme. 70–90 % teisingų.","ev":"B","src":"Káldi ir kt. 2025 (n=202, 5–6 m.)"},{"title":"Miegas ir atmintis 7–12 m.","year":"2020 · 2025","finding":"Vaikai per naktį išlaiko tai, ką suaugusieji prarado.","means":"Vėlyvas būrelis, valgantis miegą, mainais atiduoda tai, ką ką tik pastatė. ⚠️ Mechanizmo išvada, ne tyrimas apie būrelius.","ev":"B","src":"Peiffer ir kt. 2020, Scientific Reports · Kurz ir kt. 2025, J. Sleep Research"},{"title":"Ekranai ir mąstymas (8 metų kohorta)","year":"2026","finding":"Paaugliai, kurių ekrano veikla reikalavo aktyvaus mąstymo, rodė geresnį apdorojimą. Pasyvus naudojimas — ne.","means":"Svarbu ne valandos, o veiklos tipas. ⚠️ Sąsaja, ne priežastis.","ev":"B","src":"Jalanko ir kt. 2026, Pediatric Exercise Science (PANIC kohorta, n=260)"},{"title":"Telefono buvimas šalia","year":"2017 · 2023","finding":"Originalus tyrimas: telefonas ant stalo mažina darbinę atmintį. 2023 m. meta-analizė: efektas mažesnis ir nepastovesnis.","means":"Telefonas kitame kambaryje padeda — bet dydis ginčijamas, o su vaikais netirta.","ev":"B","src":"Ward ir kt. 2017 · 2023 meta-analizė"}],"bureliaiIntro":"Abėcėlės tvarka. Nereitinguojame ir nerekomenduojame nė vieno būrelio — čia tik tai, ką kiekviena veikla treniruoja, ir po dvi mažas namų praktikas.","bureliai":[{"id":"daile","icon":"🎨","label":"Dailė ir amatai","trains":"Ranką, kantrybę ir gebėjimą pagaminti tai, ko dar nėra. Piešimas iš atminties yra tikra atminties technika.","ev":"B","evNote":"Piešimas kaip mokymosi būdas — vidutiniai įrodymai. „Dailė daro protingesnį“ — ne.","home":["Nupiešk iš atminties tai, ką šiandien matei. Tik po to pažiūrėk.","Vienas daiktas, trys skirtingi būdai jį pavaizduoti."],"src":"Fiorella & Mayer 2016 — piešimas kaip generatyvusis mokymasis"},{"id":"gamta","icon":"🌱","label":"Gamta ir mokslas","trains":"Klausimo kėlimą ir tikrinimą. Vaikas spėja, paskui patikrina — ir tai yra visas mokslas.","ev":"B","evNote":"Tyrinėjimu grįstas mokymasis veikia, kai suaugęs duoda tikslą, o vaikas — žingsnius.","home":["Prieš bandymą: „kas, tavo manymu, nutiks?“ Užrašyk spėjimą.","Vienas langas, penkios minutės, penki pastebėjimai."],"src":"Skene ir kt. 2022 META (17 tyrimų, N=3 893) — vadovaujamas žaidimas"},{"id":"kalbos","icon":"🗣","label":"Kalbos","trains":"Atmintį ir garsų skyrimą. Žodžių mokymasis yra gryna prisiminimo praktika.","ev":"A","evNote":"Prisiminimo praktika svetimų žodžių mokymesi — vienas stipriausiai įrodytų dalykų.","home":["Penki žodžiai. Uždenk. Pasakyk. Tada tikrink.","Rytoj paklausk tų pačių penkių — ne šiandien po penkių minučių."],"src":"Dunlosky ir kt. 2013 · Franzoi ir kt. 2025 — prisiminimo praktika"},{"id":"muzika","icon":"🎵","label":"Muzika","trains":"Klausą, ritmą ir kasdienę praktiką. ⚠️ „Muzika daro protingesnį“ — su aktyvia kontroline grupe efektas beveik dingsta (g=0,18 → −0,02; ginčijama).","ev":"X","evNote":"Muzika verta dėl muzikos. Perkėlimo į kitus dalykus nežadam.","home":["Vienas taktas, trys kartojimai lėtai. Greitis — paskutinis.","Sudainuok tai, ką ką tik grojai — be instrumento."],"src":"Sala & Gobet 2017/2020 META · ⚠️ Bigand & Tillmann 2021 (ginčija nulį)"},{"id":"pasakojimas","icon":"📖","label":"Pasakojimas","trains":"Supratimą ir sekos laikymą galvoje. Lietuvių kalboje vaikai stringa ne prie raidžių, o prie supratimo.","ev":"B","evNote":"Bendram skaitymui — stiprūs įrodymai. Pačiam pasakojimui atskirai — meta-analizės neradau, todėl ženklelis B, ne A.","home":["Perpasakok istoriją trimis sakiniais. Tik trimis.","„O kas būtų, jei…“ — pakeisk vieną detalę ir sek toliau."],"src":"WWC 2016/2019 — bendras skaitymas (STRONG) · ⚠️ pasakojimui atskiros meta-analizės neradau"},{"id":"sportas","icon":"⚽","label":"Sportas","trains":"Stabdymą, eilės laukimą ir taisyklių keitimą vidury žaidimo.","ev":"B","evNote":"9 mėn. popamokinė judėjimo programa pagerino vykdomąją kontrolę 7–9 m. vaikams (FITKids, n=221).","home":["Penkios minutės judesio prieš namų darbus.","Žaidimas, kuriame taisyklė apsiverčia po minutės."],"src":"Hillman ir kt. 2014 FITKids RCT (n=221) · ⚠️ Ciria ir kt. 2023 — efektas ties nuliu"},{"id":"sokis","icon":"💃","label":"Šokis","trains":"Sekos laikymą kūne ir judesio kartojimą. Kūnas prisimena tai, ko galva dar nespėja.","ev":"C","evNote":"Judesys ir vykdomoji kontrolė — vidutiniai įrodymai. Šokis atskirai netirtas, todėl ženklelis C. Akademinių pažadų nedarom.","home":["Trys judesiai iš eilės, iš atminties. Rytoj — tie patys.","Rodyk seką, vaikas atkartoja atvirkščiai."],"src":"Hillman ir kt. 2014 · Diamond 2013 — judesys ir vykdomoji kontrolė · ⚠️ šokiui atskirai netirta"},{"id":"technologijos","icon":"🤖","label":"Technologijos","trains":"Tai, kas daroma: kodą, robotą, mechanizmą.","ev":"C","evNote":"⚠️ Sąžiningai: robotika turi vidutinį efektą STEM mokymuisi (g≈0,49), bet toje pačioje meta-analizėje efektas skaičiavimo mąstymui buvo NEREIKŠMINGAS (g=0,079). „Robotika lavina problemų sprendimą“ — neįrodyta. Ir tai mano paties būrelio sritis, todėl sakau garsiai.","home":["Prieš statant — nupiešk seką. Paskui statyk pagal ją.","Kas sugedo? Viena hipotezė, vienas bandymas, tada kita."],"src":"Ouyang & Xu 2024 META (N=2 433) — g≈0,49 STEM · g=0,079 skaičiavimo mąstymui (nereikšminga)"}],"bureliaiKita":"Kita — parašyk, pridėsim. krisvas.lt","irankiai":[{"id":"iphone-gray","icon":"📱","title":"iPhone — pilkas ekranas","steps":["Settings → Accessibility → Display & Text Size → Color Filters → įjungti → Grayscale.","Settings → Accessibility → Accessibility Shortcut → pažymėti Color Filters.","Tris kartus paspausk šoninį mygtuką — spalvos įsijungia ir išsijungia."],"ev":"C","evNote":"Vienas tyrimas: ~38 min/d mažiau ekrano. 2024 m. pakartojimas — silpnesnis. Su vaikais netirta."},{"id":"android-gray","icon":"🤖","title":"Android — pilkas ekranas ir miego režimas","steps":["Settings → Digital Wellbeing → Bedtime mode → Bedtime routine.","Nustatyk miego laiką → įjunk Grayscale.","Paklausk vaiko po savaitės: pastebėjai skirtumą?"],"ev":"C","evNote":"Tie patys prieštaringi duomenys kaip iPhone."},{"id":"ipad-ga","icon":"🔒","title":"iPad — Guided Access","steps":["Settings → Accessibility → Guided Access → įjungti, nustatyti kodą.","Atidaryk vieną programėlę → tris kartus šoninis mygtukas → Start.","iPad užrakintas TOJE vienoje programėlėje, kol įvesi kodą."],"ev":"C","evNote":"Trinties įrankis, ne mokymosi technika. Nieko neišmoko — tik nuima vieną blaškymosi šaltinį."},{"id":"phone-tool","icon":"🛠","title":"Telefonas → mokymosi įrankis","steps":["Diktofonas: vaikas 60 sek. paaiškina temą sau. Rytoj perklauso.","Kamera: nufotografuok užduotį, uždenk atsakymą, bandyk iš atminties.","Laikmatis: 2 minutės vienam darbui. Matomas ekrane."],"ev":"B","evNote":"Aktyvus naudojimas (kūrimas, aiškinimas) skiriasi nuo pasyvaus. 2026 m. kohorta: skirtumas yra veiklos tipe, ne valandose. ⚠️ Sąsaja, ne priežastis."},{"id":"pc-tool","icon":"💻","title":"Kompiuteris → mokymosi įrankis","steps":["macOS: Control Center → Focus → naujas „Namų darbai“ režimas.","Windows: Settings → System → Focus sessions.","Vienas langas ekrane. Kiti — uždaryti, ne sumažinti."],"ev":"C","evNote":"Trinties įrankis. Suporuok jį su technika: telefonas kitame kambaryje, TADA 60 sekundžių paaiškinimas."}],"bureliaiIntro_en":"In alphabetical order. We do not rank or recommend any club — this is only what each activity trains, plus two small practices you can do at home."},"games":{"games":[{"id":"atsimink","icon":"🧠","name":"Atsimink ir pasakyk","sub":"Prisiminimo praktika","rule":"5 daiktai 10 sekundžių. Paskui jie dingsta. Rask tuos penkis tarp dešimties.","ev":"A","honest":"Šis žaidimas treniruoja prisiminimą — tai, ką jis ir matuoja. Bendri smegenų treniruokliai neperkelia įgūdžio į mokyklą; prisiminimo praktika mokyklinei medžiagai — perkelia.","src":"Dunlosky 2013 · Franzoi 2025","free":true,"name_en":"Remember and say","sub_en":"Recall practice","rule_en":"5 objects for 10 seconds. Then they disappear. Find those five among ten."},{"id":"laikmatis","icon":"⏱","name":"Dėmesio laikmatis","sub":"Vienas darbas, matomas laikas","rule":"Pasirink 2, 5 ar 10 minučių. Vienas darbas. Kol skaičiuoja — nieko kito.","ev":"C","honest":"Laikmatis ir "tip":"Gerai. Rytoj tą pačią temą — bus lengviau. Tai ne gabumas, o kartojimas."},{"n":2,"icon":"🙂","label":"Vidutiniškai. Vietomis stringu.","tip":"Rask TĄ vietą, kur stringi. Ten ir yra tavo mokymosi taškas — ne visoje temoje."},{"n":3,"icon":"💪","label":"Lengva. Paaiškinau sklandžiai.","tip":"Tada paklausk savęs „kodėl taip?“ tris kartus iš eilės. Jei atsakymas baigiasi — tema dar neišmokta iki galo."}],"timerChecklist":["Telefonas kitame kambaryje","Ant stalo — tik tai, ko reikia dabar","Vienas darbas, ne du","Vanduo šalia, kad nereikėtų keltis"]},"podcasts":[{"band":"4-5","title":"Kaip smegenys mokosi — pasakyk, ką atsimeni","minutes":0.4,"script":"Ei, tu! Žinojai, kad tavo smegenys auga kaip mažas medis — kuo daugiau naudoji, tuo stipresnės šakos?\n\nŠiandien vieną žaidimą. Kai ką nors pamatai ar išgirsti — po truputį pabandyk PASAKYTI, ką atsimeni. Nesvarbu, jei ne viską. Tas bandymas prisiminti ir stiprina medį.\n\nPabandyk dabar: ką valgei pusryčiams? Pasakyk garsiai mamai ar tėčiui.\n\nAš Kristijonas. Rytoj — kita technika.","audio":"audio/mkk-4-5.mp3","status":"needs-ear-check"},{"band":"6-7","title":"Kaip smegenys mokosi — pasakyk, ką atsimeni","minutes":0.4,"script":"Ei, tu! Ar žinai, kaip tavo smegenys mokosi naujų dalykų?\n\nJos veikia kaip raumuo — kuo dažniau bandai prisiminti, tuo stipresnės tampa. Ne tada, kai kas nors tau paaiškina antrą kartą, o tada, kai PATS pabandai atsiminti.\n\nŠiandien technika: po pasakos ar pamokos, nežiūrėk į knygą — pabandyk garsiai pasakyti, ką atsimeni. Net jei ne viską — tas bandymas ir yra treniruotė.\n\nPabandyk dabar: ką darei šįryt? Pasakyk garsiai.\n\nAš Kristijonas. Rytoj — kita technika.","audio":"audio/mkk-6-7.mp3","status":"needs-ear-check"},{"band":"8-9","title":"Kaip smegenys mokosi — uždaryk knygą ir prisimink","minutes":0.7,"script":"Kaip tavo smegenys iš tikrųjų mokosi? Ne taip, kaip dauguma galvoja.\n\nPerskaityti tekstą dar kartą jaučiasi naudinga — bet tai beveik neveikia. Tavo smegenys stiprėja tada, kai PATS pabandai prisiminti, be pagalbos, be žiūrėjimo į knygą. Kaip svoris raumeniui — sunku iš pradžių, o būtent tas sunkumas ir stiprina atmintį.\n\nTechnika, kurią išbandyk šiandien: po to, kai ką nors skaitai ar mokaisi, uždaryk knygą. Garsiai pasakyk, ką atsimeni — savais žodžiais, niekur nežiūrėdamas. Tik tada atsiverk knygą ir patikrink, ko trūko. Šitą kartok kiekvieną dieną — trumpai, bet tikrai.\n\nDuok sau 2 minutes dabar: pasirink šiandienos pamoką ar knygą, uždaryk ją, ir pasakyk garsiai tris dalykus, kuriuos atsimeni.\n\nAš Kristijonas. Rytoj — kita technika.","audio":"audio/mkk-8-9.mp3","status":"needs-ear-check"},{"band":"10-11","title":"Kaip smegenys mokosi — uždaryk knygą ir prisimink","minutes":0.9,"script":"Kaip tavo smegenys iš tikrųjų mokosi? Atsakymas nustebins.\n\nPerskaityti pastraipą dar kartą ar pabraukti tekstą spalvotu žymekliu — jaučiasi produktyviai, bet mokslas rodo: tai vienas silpniausių būdų mokytis. Stipriausias būdas — priešingai — kai užsimerki ir PATS bandai prisiminti, be jokios pagalbos ir be knygos šalia. Vienoje penktokų klasėje mokiniai, kurie taip treniravosi, atsakė teisingai daug dažniau nei tie, kurie tiesiog perskaitė medžiagą dar kartą.\n\nKodėl tai veikia? Nes prisiminimas, kai jau šiek tiek pamiršai — sunkus. O tas sunkumas ir yra pati treniruotė smegenims, ne bausmė.\n\n2 minučių veiksmas: baigęs pamoką ar skaitymą, uždaryk knygą ir sąsiuvinį. Garsiai arba raštu išvardink viską, ką atsimeni. Tik POTOM atsiversk ir patikrink, ką praleidai.\n\nAš Kristijonas. Rytoj — kita technika.","audio":"audio/mkk-10-11.mp3","status":"needs-ear-check"},{"band":"12","title":"Kodėl smegenų treniruokliai neveikia — ir kas veikia","minutes":1.0,"script":"Dauguma smegenų treniruoklių neveikia. Rimtai. Yra tyrimas su 235 vaikais — po aštuonių savaičių treniruotės jie pagerėjo TIK tame pačiame žaidime. Ne mokykloje, ne dėmesyje per pamoką, niekur kitur. Pinigai ir laikas — į vėją.\n\nTai kas veikia? Trys dalykai, kuriuos gali išbandyti šiandien, be jokios programėlės. Pirma: kai mokaisi, nustok skaityti dar kartą. Vietoj to — uždaryk knygą ir garsiai arba raštu prisimink, ką tik skaitei. Tas jausmas, kai sunku prisiminti — tai ir yra treniruotė, ne ženklas, kad kažkas negerai.\n\nAntra: išsklaidyk mokymąsi per kelias dienas, ne viską per vieną vakarą prieš testą. Smegenims reikia laiko tarp bandymų, ne vienos ilgos sesijos.\n\nTrečia — telefoną kol mokaisi padėk KITAME kambaryje. Ne ant stalo apversto ekranu žemyn — kitame kambaryje. Tavo smegenys negali sutelkti dėmesio, kol laukia pranešimo, net jei jo neliečia.\n\nPabandyk šiandien: 10 minučių be telefono kambaryje, ir viena prisiminimo pertrauka.\n\nAš Kristijonas. Rytoj — kita technika.","audio":"audio/mkk-12.mp3","status":"needs-ear-check"},{"band":"13","title":"Kodėl smegenų treniruokliai neveikia — ir kas veikia","minutes":1.3,"script":"Tiesa, kurios niekas nesako: dauguma „smegenų treniruoklių\" programėlių neveikia. Tyrimas su 235 vaikais parodė — po aštuonių savaičių treniruotės jie pagerėjo tik pačiame žaidime. Į mokyklą, į testus, į koncentraciją apskritai tai nepersikėlė. Skamba nusivylusiai, bet svarbu žinoti, kol nepirkai dar vienos.\n\nKas veikia iš tikrųjų — nuobodžiau, bet realu, ir nemokama. Pirma: nustok skaityti konspektą dar kartą prieš testą. Vietoj to uždaryk jį ir bandyk prisiminti be pagalbos. Kuo sunkiau prisiminti, tuo geriau tai veikia — nes tavo smegenys tuo metu tikrai dirba, o ne tik atpažįsta pažįstamą tekstą.\n\nAntra: mokykis dalimis per kelias dienas, ne visą naktį prieš egzaminą. Tavo smegenys tvirtina atmintį poilsio metu, ne vien tuo metu, kai žiūri į puslapį.\n\nTrečia, ir sunkiausia: kol mokaisi, telefoną nunešk į kitą kambarį. Ne tylųjį režimą — KITĄ kambarį. Vien žinojimas, kad jis šalia, atima dėmesio, net jei jo neliečia.\n\nPabandyk šiandien: viena pertrauka be perskaitymo, viena be telefono kambaryje.\n\nAš Kristijonas. Rytoj — kita technika.","audio":"audio/mkk-13.mp3","status":"needs-ear-check"},{"band":"14","title":"Kodėl smegenų treniruokliai neveikia — ir kas veikia","minutes":1.1,"script":"Realybė: dauguma „smegenų treniruoklių\" ir atminties programėlių tiesiog neveikia už savo paties žaidimo ribų. Tyrimas su 235 vaikais tai įrodė — aštuonios savaitės treniruočių, o rezultatas persikėlė tik į patį žaidimą. Ne į mokyklą. Ne į koncentraciją apskritai. Jei kažkas tau parduoda „smegenų treniruotę\" — klausk, kur ta programėlė tai įrodė.\n\nTai kas realiai veikia — ne stebuklinga programėlė, o trys nuobodūs įpročiai, kuriuos gali pradėti šiandien, nemokamai. Pirma: nustok perskaitinėti konspektus prieš testą — tai jaučiasi produktyviai, bet moksliškai tai vienas silpniausių metodų. Vietoj to uždaryk juos ir prisimink be pagalbos. Sunku prisiminti — reiškia, kad veikia, o ne kad tu blogas mokinys.\n\nAntra: paskirstyk mokymąsi per kelias dienas, ne per vieną naktį — atmintis tvirtėja poilsio metu.\n\nTrečia: kol mokaisi, telefoną neškis į kitą kambarį, ne tik ant tylaus režimo. Vien jo buvimas šalia, net užrakintas, atima dalį dėmesio.\n\nŠiandien: viena mokymosi sesija be telefono kambaryje, su prisiminimo pertrauka pabaigoje.\n\nAš Kristijonas. Rytoj — kita technika.","audio":"audio/mkk-14.mp3","status":"needs-ear-check"}],"illustrations":{"hero":{"file":"img/hero.webp","alt":"Vaikas sėdi ramiai užsimerkęs, virš galvos sklando raudonas siūlas su smegenų kibirkšties draugu","tone":"#D90429"},"brain-learns":{"file":"img/brain-learns.webp","alt":"Vaikas laisto medelį, kurio šaknys nupieštos kaip šakotas neuronas","tone":"#9BB59C"},"top3":{"file":"img/top3.webp","alt":"Trys sukrauti akmenys, ant viršaus balansuoja mažas kibirkšties padarėlis","tone":"#D9C9A8"},"memory":{"file":"img/memory.webp","alt":"Vaikas uždaro knygą, prilaiko pirštą prie smilkinio, virš galvos sklando kortelė","tone":"#D8B4B0"},"attention":{"file":"img/attention.webp","alt":"Vaikas laiko mažą žibintą ramioje, tuščioje erdvėje","tone":"#9FB3C8"},"focus":{"file":"img/focus.webp","alt":"V
